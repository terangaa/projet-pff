<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Acheteur 🌾</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.7.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* Layout général */
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #e0f7fa, #a5d6a7);
        }

        /* Navbar */
        .navbar-brand { font-family: 'Playfair Display', serif; font-weight: 700; letter-spacing: 1px; font-size: 1.4rem; }

        /* Contenu principal */
        .main-content {
            flex: 1 0 auto;
            padding: 40px 20px;
        }

        /* Heading */
        h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        /* Cartes KPI */
        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 25px;
        }

        .kpi-card {
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            position: relative;
            color: #333;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
            text-align: center;
            cursor: pointer;
        }
        .kpi-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
        }

        /* Icônes animées */
        .kpi-icon {
            font-size: 50px;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: #fff;
            transition: transform 0.3s;
        }
        .kpi-card:hover .kpi-icon {
            transform: translateY(-5px) scale(1.1);
        }

        /* Titres et descriptions */
        .kpi-title {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .kpi-desc {
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 10px;
        }

        /* Badge animé */
        .kpi-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #43a047;
            color: #fff;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            animation: pulse 2s infinite;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Boutons */
        .btn-primary { background: linear-gradient(135deg,#43a047,#2e7d32); border:none; }
        .btn-success { background: linear-gradient(135deg,#66bb6a,#388e3c); border:none; }

        /* Footer */
        footer {
            flex-shrink: 0;
            background: linear-gradient(135deg,#43a047,#2e7d32);
            color: #fff;
            text-align: center;
            padding: 15px 0;
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background: linear-gradient(135deg,#43a047,#2e7d32);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Espace Acheteur</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3">Connecté : <b th:text="${email}"></b></span>
            <a href="/auth/logout" class="btn btn-outline-light btn-sm">Déconnexion</a>
        </div>
    </div>
</nav>

<!-- Contenu principal -->
<div class="container main-content">
    <h2>🛒 Tableau de bord Acheteur</h2>

    <div class="kpis">
        <!-- Produits -->
        <a href="/achats" class="text-decoration-none">
            <div class="kpi-card">
                <div class="kpi-icon"><i class="ri-store-line"></i></div>
                <div class="kpi-title">Produits</div>
                <div class="kpi-desc">Découvrez et achetez les produits</div>
                <div class="kpi-badge" th:text="${nbProduits}">0</div>
            </div>
        </a>

        <!-- Commandes -->
        <a href="/achats/mes" class="text-decoration-none">
            <div class="kpi-card" style="background: linear-gradient(180deg,#66bb6a,#388e3c); color:#fff;">
                <div class="kpi-icon" style="background: linear-gradient(135deg,#81c784,#2e7d32);"><i class="ri-shopping-basket-line"></i></div>
                <div class="kpi-title">Mes Commandes</div>
                <div class="kpi-desc">Suivi de vos commandes</div>
                <div class="kpi-badge" th:text="${nbCommandes}">0</div>
            </div>
        </a>

        <!-- Panier -->
        <a href="/panier" class="text-decoration-none">
            <div class="kpi-card" style="background: linear-gradient(180deg,#ffc107,#ff9800); color:#fff;">
                <div class="kpi-icon" style="background: linear-gradient(135deg,#ffca28,#ffa000);"><i class="ri-shopping-cart-line"></i></div>
                <div class="kpi-title">Panier</div>
                <div class="kpi-desc">Articles en attente d’achat</div>
                <div class="kpi-badge" th:text="${nbPanier}">0</div>
            </div>
        </a>

        <!-- Historique -->
        <a href="/achats/historique" class="text-decoration-none">
            <div class="kpi-card" style="background: linear-gradient(180deg,#1e88e5,#1565c0); color:#fff;">
                <div class="kpi-icon" style="background: linear-gradient(135deg,#42a5f5,#1565c0);"><i class="ri-time-line"></i></div>
                <div class="kpi-title">Historique</div>
                <div class="kpi-desc">Vos achats passés</div>
                <div class="kpi-badge" th:text="${nbHistorique}">0</div>
            </div>
        </a>
    </div>
</div>

<!-- Footer -->
<footer>
    <p class="mb-0">© 2025 - Plateforme Agricole - Espace Acheteur</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
