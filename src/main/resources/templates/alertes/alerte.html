<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>🌾 Dashboard Agricole Immersif</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top left, #071a0c, #000);
            color: #e0e0e0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(90deg, #046307, #013b05);
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.3);
        }
        .navbar-brand { font-weight: 600; font-size: 1.5rem; letter-spacing: 1px; }

        /* Accueil */
        .welcome-section {
            text-align: center;
            margin: 2rem 0;
        }
        .welcome-section h1 {
            font-size: 2.5rem;
            color: #00ff88;
        }
        .welcome-section p {
            font-size: 1.2rem;
            color: #aaffaa;
        }

        /* Statut & contrôle */
        #status-indicator {
            width: 14px; height: 14px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow:0 0 10px red;
        }
        .btn-group-custom { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        /* Ticker */
        #alertes-ticker {
            background: rgba(0,30,0,0.85);
            padding: 0.8rem;
            border-radius: 12px;
            overflow: hidden;
            white-space: nowrap;
            font-size: 1.2rem;
            box-shadow: inset 0 0 12px rgba(0,255,100,0.4);
            margin-bottom: 1rem;
        }
        .ticker-item {
            display: inline-block;
            animation: scroll 25s linear infinite;
            color: #00ff88;
        }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* Cartes alerte */
        .card-alert {
            background: linear-gradient(145deg, #0f1b10, #192a1a);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,255,80,0.2);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .card-alert:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,255,80,0.3); }
        .card-title { color: #00ff99; font-weight: 600; }
        .badge { font-size: 1rem; padding: 0.4em 0.7em; }

        .alerte-rouge { border-left: 6px solid #ff5555; animation: pulseRed 1.5s infinite; }
        .alerte-jaune { border-left: 6px solid #ffd700; animation: pulseYellow 2s infinite; }
        .alerte-vert { border-left: 6px solid #00ff88; }

        @keyframes pulseRed { 0%,100%{box-shadow:0 0 10px #ff3333;}50%{box-shadow:0 0 25px #ff6666;} }
        @keyframes pulseYellow { 0%,100%{box-shadow:0 0 10px #ffd700;}50%{box-shadow:0 0 25px #fff380;} }

        canvas { background: rgba(255,255,255,0.05); border-radius:8px; padding:5px; }

        /* Grille responsive */
        @media (min-width:1200px){ #alertes-container{ display:grid; grid-template-columns: repeat(4,1fr); gap:1.2rem;} }
        @media (max-width:1199px) and (min-width:768px){ #alertes-container{ display:grid; grid-template-columns: repeat(2,1fr); gap:1rem;} }
        @media (max-width:767px){ #alertes-container{ display:grid; grid-template-columns:1fr; gap:1rem;} }
    </style>
</head>

<body>
<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand text-white" href="#"><i class="fas fa-seedling me-2"></i> Système Agricole Intelligent</a>
    </div>
</nav>

<!-- Accueil -->
<div class="welcome-section" id="section-welcome">
    <h1><i class="fas fa-user-far"></i> Bienvenue, Agriculteur !</h1>
    <p>Système d’Alerte Agricole Immersif</p>
</div>

<!-- Statut & contrôle -->
<div class="container my-2 d-flex justify-content-between align-items-center flex-wrap">
    <div class="d-flex align-items-center mb-2 mb-md-0">
        <span id="status-indicator"></span>
        <span id="status-text" class="text-white me-3">Déconnecté</span>
    </div>
    <div class="btn-group-custom">
        <label for="lang-select" class="form-label text-white me-2">Langue :</label>
        <select id="lang-select" class="form-select w-auto d-inline-block me-2">
            <option value="fr-FR" selected>Français</option>
            <option value="wo-WO">Wolof</option>
            <option value="sr-SR">Sérère</option>
        </select>
        <button id="btn-start" class="btn btn-success me-1"><i class="fas fa-play"></i> Démarrer</button>
        <button id="btn-stop" class="btn btn-danger me-1" disabled><i class="fas fa-stop"></i> Arrêter</button>
        <!-- Liens Thymeleaf / backend -->
        <a class="btn btn-outline-light me-1" th:href="@{/dashboard}"><i class="bi bi-house-door"></i> Accueil</a>
        <a href="/auth/logout" class="btn btn-outline-light"><i class="bi bi-box-arrow-right"></i> Déconnexion</a>
    </div>
</div>

<audio id="alert-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

<!-- Dashboard -->
<div class="container my-5" id="dashboard">
    <div class="card shadow-lg border-0">
        <div class="card-header text-center py-3 bg-success bg-gradient">
            <h2 class="mb-0 text-white"><i class="fas fa-broadcast-tower me-2"></i> Tableau de Bord des Alertes</h2>
        </div>
        <div class="card-body p-4 bg-dark text-white rounded-bottom">
            <h5 class="mb-3">📡 Flux en direct</h5>
            <div id="alertes-ticker"></div>
            <div id="alertes-container" class="mt-4"></div>
        </div>
    </div>
</div>

<script>
    let websocketActif=false, alertInterval=null;
    const tickerDiv=document.getElementById("alertes-ticker");
    const alertSound=document.getElementById("alert-sound");
    const statusIndicator=document.getElementById("status-indicator");
    const statusText=document.getElementById("status-text");
    const charts={};
    const maxPoints=20;

    function updateStatus(connected){
        if(connected){
            statusIndicator.style.backgroundColor="limegreen";
            statusIndicator.style.boxShadow="0 0 10px limegreen";
            statusText.textContent="Connecté (Simulation)";
        } else{
            statusIndicator.style.backgroundColor="red";
            statusIndicator.style.boxShadow="0 0 10px red";
            statusText.textContent="Déconnecté";
        }
    }

    function parlerAlerte(msg){
        const synth=window.speechSynthesis;
        const langue=document.getElementById("lang-select").value;
        const utterance=new SpeechSynthesisUtterance(msg);
        utterance.lang=langue;
        synth.speak(utterance);
    }

    function creerCarte(ville){
        const container=document.getElementById("alertes-container");
        let card=document.getElementById("alerte-"+ville);
        if(!card){
            card=document.createElement("div");
            card.id="alerte-"+ville;
            card.className="card card-alert alerte-vert";
            card.innerHTML=`<div class="card-body">
                <h5 class="card-title">${ville}</h5>
                <span class="badge bg-success">🟢 Normal</span>
                <canvas class="chart-temp mt-3" height="80"></canvas>
            </div>`;
            container.appendChild(card);
            charts[ville]=new Chart(card.querySelector(".chart-temp").getContext("2d"),{
                type:"line",
                data:{ labels:[], datasets:[{ label:"Température (°C)", data:[], borderColor:"#00ff88", backgroundColor:"rgba(0,255,136,0.2)", fill:true }] },
                options:{ plugins:{ legend:{ labels:{ color:"#e0e0e0" } } }, scales:{ x:{ ticks:{ color:"#aaa" } }, y:{ ticks:{ color:"#aaa" } } } }
            });
        }
        return card;
    }

    function updateChart(ville,valeur){
        const chart=charts[ville];
        const now=new Date().toLocaleTimeString();
        chart.data.labels.push(now);
        chart.data.datasets[0].data.push(valeur);
        if(chart.data.labels.length>maxPoints){
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
        }
        chart.update();
    }

    function genererAlerte(){
        const villes=["Kaolack","Fatick","Dakar","Tambacounda"];
        const messages=["Température critique !","Humidité élevée !","Manque d’eau détecté !","Alerte rouge météo !"];
        const ville=villes[Math.floor(Math.random()*villes.length)];
        const msg=messages[Math.floor(Math.random()*messages.length)];
        const temperature=(20+Math.random()*15).toFixed(1);
        const texte=`[⚠️] ${ville} → ${msg} (${temperature}°C)`;

        const card=creerCarte(ville);
        updateChart(ville,temperature);

        const badge=card.querySelector(".badge");
        if(msg.includes("rouge")||msg.includes("critique")){
            badge.textContent="🔴 Urgent";
            badge.className="badge bg-danger";
            card.className="card card-alert alerte-rouge";
        } else if(msg.includes("Humidité")||msg.includes("Manque")){
            badge.textContent="🟡 Avertissement";
            badge.className="badge bg-warning";
            card.className="card card-alert alerte-jaune";
        } else{
            badge.textContent="🟢 Normal";
            badge.className="badge bg-success";
            card.className="card card-alert alerte-vert";
        }

        // Ticker + son + synthèse vocale
        afficherTicker(texte);
        alertSound.play();
        parlerAlerte(texte);
    }

    function afficherTicker(message){
        const span=document.createElement("span");
        span.classList.add("ticker-item");
        span.textContent=message;
        tickerDiv.appendChild(span);
        setTimeout(()=>span.remove(),25000);
    }

    function demarrerAlertes(){
        if(websocketActif) return;
        websocketActif=true;
        updateStatus(true);
        document.getElementById("btn-start").disabled=true;
        document.getElementById("btn-stop").disabled=false;
        alertInterval=setInterval(genererAlerte,4000);
    }

    function arreterAlertes(){
        websocketActif=false;
        clearInterval(alertInterval);
        window.speechSynthesis.cancel();
        updateStatus(false);
        document.getElementById("btn-start").disabled=false;
        document.getElementById("btn-stop").disabled=true;
    }

    document.getElementById("btn-start").addEventListener("click",demarrerAlertes);
    document.getElementById("btn-stop").addEventListener("click",arreterAlertes);

    // Initialisation du statut
    window.addEventListener("DOMContentLoaded",()=>updateStatus(false));
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
