<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier - PAGAM</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .cart-container {
            max-width: 900px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .cart-empty {
            text-align: center;
            padding: 50px 0;
            font-size: 1.5rem;
            color: #6c757d;
        }
        .cart-table th, .cart-table td {
            vertical-align: middle;
        }
        .btn-clear {
            background-color: #dc3545;
            color: #fff;
        }
        .btn-clear:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
<div class="cart-container">
    <h2 class="mb-4">Mon Panier</h2>

    <!-- Panier vide -->
    <div th:if="${#lists.isEmpty(articles)}" class="cart-empty">
        Votre panier est vide.
    </div>

    <!-- Panier avec produits -->
    <div th:if="${!#lists.isEmpty(articles)}">
        <table class="table cart-table">
            <thead class="table-light">
            <tr>
                <th>Produit</th>
                <th>Prix</th>
                <th>Quantité</th>
                <th>Total</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${articles}">
                <td th:text="${item.produit.nom}">Nom Produit</td>
                <td th:text="${item.prix} + ' FCFA'">0 FCFA</td>
                <td>
                    <input type="number" min="1" th:value="${item.quantite}" class="form-control form-control-sm"
                           th:onchange="modifierQuantite([[${item.produit.id}]], this.value)">
                </td>
                <td th:text="${item.montantTotal} + ' FCFA'">0 FCFA</td>
                <td>
                    <button class="btn btn-sm btn-danger" th:onclick="supprimerProduit([[${item.produit.id}]])">
                        Supprimer
                    </button>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <h4>Total: <span th:text="${total} + ' FCFA'">0 FCFA</span></h4>
            <div>
                <button class="btn btn-clear me-2" onclick="viderPanier()">Vider le panier</button>
                <button class="btn btn-success" onclick="validerPanier()">Valider le panier</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS (optionnel pour modals, dropdowns) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function modifierQuantite(produitId, quantite) {
        fetch(`/panier/modifier/${produitId}?quantite=${quantite}`, { method: 'POST' })
            .then(() => location.reload());
    }

    function supprimerProduit(produitId) {
        fetch(`/panier/supprimer/${produitId}`, { method: 'DELETE' })
            .then(() => location.reload());
    }

    function viderPanier() {
        fetch(`/panier/vider`, { method: 'POST' })
            .then(() => location.reload());
    }

    function validerPanier() {
        fetch(`/panier/valider`, { method: 'POST' })
            .then(response => response.text())
            .then(msg => alert(msg))
            .finally(() => location.reload());
    }
</script>
</body>
</html>
