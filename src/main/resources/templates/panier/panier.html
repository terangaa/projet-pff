<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier - PAGAM</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSRF Meta Tags -->
    <meta th:name="'_csrf'" th:content="${_csrf?.token}"/>
    <meta th:name="'_csrf_header'" th:content="${_csrf?.headerName}"/>

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .cart-container {
            max-width: 1000px;
            margin: 30px auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .cart-empty {
            text-align: center;
            padding: 60px 0;
            font-size: 1.4rem;
            color: #6c757d;
        }
        .cart-table th, .cart-table td {
            vertical-align: middle;
            padding: 15px 10px;
        }
        .cart-table thead th {
            background-color: #2c3e50;
            color: white;
            border: none;
            font-weight: 600;
        }
        .btn-clear {
            background-color: #dc3545;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-weight: 500;
        }
        .btn-clear:hover {
            background-color: #c82333;
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
        .btn-success {
            padding: 10px 25px;
            font-weight: 500;
        }
        .quantity-input {
            width: 80px;
            text-align: center;
        }
        .product-name {
            font-weight: 600;
            color: #2c3e50;
        }
        .total-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .nav-header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            padding: 15px 0;
            margin-bottom: 30px;
        }
        .nav-brand {
            color: white !important;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .nav-link-custom {
            color: white !important;
            font-weight: 500;
        }
        .nav-link-custom:hover {
            color: #f8f9fa !important;
        }
    </style>
</head>
<body>
<!-- Navigation Header -->
<nav class="navbar navbar-expand-lg nav-header">
    <div class="container">
        <a class="navbar-brand nav-brand" th:href="@{/dashboard}">
            <i class="bi bi-basket"></i> AgriShop
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link nav-link-custom" th:href="@{/dashboard}">
                <i class="bi bi-house"></i> Accueil
            </a>
            <a class="nav-link nav-link-custom" th:href="@{/produits}">
                <i class="bi bi-shop"></i> Produits
            </a>
            <a class="nav-link nav-link-custom" th:href="@{/auth/logout}">
                <i class="bi bi-box-arrow-right"></i> Déconnexion
            </a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="cart-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary">
                <i class="bi bi-cart3"></i> Mon Panier
            </h2>
            <span class="badge bg-primary fs-6">
                    <span th:text="${nombreArticles}">0</span> article(s)
                </span>
        </div>

        <!-- Panier vide -->
        <div th:if="${#lists.isEmpty(articles)}" class="cart-empty">
            <i class="bi bi-cart-x" style="font-size: 4rem; color: #dee2e6;"></i>
            <h3 class="mt-3">Votre panier est vide</h3>
            <p class="text-muted">Ajoutez des produits pour commencer vos achats</p>
            <a th:href="@{/produits}" class="btn btn-primary btn-lg mt-3">
                <i class="bi bi-arrow-left"></i> Découvrir nos produits
            </a>
        </div>

        <!-- Panier avec produits -->
        <div th:if="${!#lists.isEmpty(articles)}">
            <div class="table-responsive">
                <table class="table cart-table table-hover">
                    <thead>
                    <tr>
                        <th>Produit</th>
                        <th>Prix unitaire</th>
                        <th>Quantité</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${articles}">
                        <td>
                            <div class="product-name" th:text="${item.produit.nom}">Nom Produit</div>
                            <small class="text-muted" th:if="${item.produit.description}" th:text="${item.produit.description}"></small>
                        </td>
                        <td>
                            <span class="fw-bold" th:text="${#numbers.formatDecimal(item.prix, 0, 'COMMA', 2, 'POINT')} + ' FCFA'">0 FCFA</span>
                        </td>
                        <td>
                            <input type="number" min="1" max="100" th:value="${item.quantite}"
                                   class="form-control quantity-input"
                                   th:onchange="modifierQuantite([[${item.produit.id}]], this.value)">
                        </td>
                        <td>
                            <span class="fw-bold text-success" th:text="${#numbers.formatDecimal(item.montantTotal, 0, 'COMMA', 2, 'POINT')} + ' FCFA'">0 FCFA</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger"
                                    th:onclick="supprimerProduit([[${item.produit.id}]])"
                                    title="Supprimer du panier">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Section Total et Actions -->
            <div class="total-section">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h3 class="mb-0">Total Général</h3>
                        <p class="mb-0 opacity-75" th:text="${nombreArticles} + ' article(s) dans votre panier'"></p>
                    </div>
                    <div class="col-md-6 text-end">
                        <h2 class="mb-0" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT')} + ' FCFA'">0 FCFA</h2>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-outline-secondary" onclick="viderPanier()">
                    <i class="bi bi-trash"></i> Vider le panier
                </button>
                <a th:href="@{/produits}" class="btn btn-outline-primary">
                    <i class="bi bi-plus-circle"></i> Continuer mes achats
                </a>
                <button class="btn btn-success btn-lg" onclick="validerPanier()">
                    <i class="bi bi-check-circle"></i> Valider la commande
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function modifierQuantite(produitId, quantite) {
        if (quantite < 1) {
            alert('La quantité doit être au moins 1');
            location.reload();
            return;
        }

        const csrfToken = document.querySelector("meta[name='_csrf']")?.content;
        const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.content;

        const headers = {
            'Content-Type': 'application/x-www-form-urlencoded'
        };

        if (csrfHeader && csrfToken) {
            headers[csrfHeader] = csrfToken;
        }

        const formData = new URLSearchParams();
        if (csrfToken) {
            formData.append('_csrf', csrfToken);
        }

        fetch(`/panier/modifier/${produitId}?quantite=${quantite}`, {
            method: 'POST',
            headers: headers,
            body: formData,
            credentials: 'include'
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erreur lors de la modification');
                }
                location.reload();
            })
            .catch(error => {
                console.error('Erreur:', error);
                alert('Erreur lors de la modification de la quantité');
                location.reload();
            });
    }

    function supprimerProduit(produitId) {
        if (!confirm('Êtes-vous sûr de vouloir supprimer ce produit du panier ?')) {
            return;
        }

        const csrfToken = document.querySelector("meta[name='_csrf']")?.content;
        const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.content;

        const headers = {};
        if (csrfHeader && csrfToken) {
            headers[csrfHeader] = csrfToken;
        }

        fetch(`/panier/supprimer/${produitId}`, {
            method: 'DELETE',
            headers: headers,
            credentials: 'include'
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erreur lors de la suppression');
                }
                location.reload();
            })
            .catch(error => {
                console.error('Erreur:', error);
                alert('Erreur lors de la suppression du produit');
                location.reload();
            });
    }

    function viderPanier() {
        if (!confirm('Êtes-vous sûr de vouloir vider complètement votre panier ?')) {
            return;
        }

        const csrfToken = document.querySelector("meta[name='_csrf']")?.content;
        const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.content;

        const headers = {
            'Content-Type': 'application/x-www-form-urlencoded'
        };

        if (csrfHeader && csrfToken) {
            headers[csrfHeader] = csrfToken;
        }

        const formData = new URLSearchParams();
        if (csrfToken) {
            formData.append('_csrf', csrfToken);
        }

        fetch(`/panier/vider`, {
            method: 'POST',
            headers: headers,
            body: formData,
            credentials: 'include'
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erreur lors du vidage du panier');
                }
                location.reload();
            })
            .catch(error => {
                console.error('Erreur:', error);
                alert('Erreur lors du vidage du panier');
                location.reload();
            });
    }

    function validerPanier() {
        if (!confirm('Confirmer la validation de votre commande ?')) {
            return;
        }

        console.log('Validation du panier...');

        const csrfToken = document.querySelector("meta[name='_csrf']")?.content;
        const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.content;

        const headers = {
            'Content-Type': 'application/x-www-form-urlencoded'
        };

        if (csrfHeader && csrfToken) {
            headers[csrfHeader] = csrfToken;
        }

        const formData = new URLSearchParams();
        if (csrfToken) {
            formData.append('_csrf', csrfToken);
        }

        console.log('Envoi requête de validation...');

        fetch('/panier/valider', {
            method: 'POST',
            headers: headers,
            body: formData,
            credentials: 'include'
        })
            .then(response => {
                console.log('Status:', response.status);
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    return response.json();
                } else {
                    return response.text().then(text => {
                        throw new Error('Réponse non JSON: ' + text);
                    });
                }
            })
            .then(data => {
                console.log('Réponse JSON:', data);
                if(data.success) {
                    alert('✅ ' + data.message);

                    // Redirection vers la page des commandes
                    if (data.redirectUrl) {
                        window.location.href = data.redirectUrl;
                    } else {
                        window.location.href = '/commandes';
                    }
                } else {
                    alert('❌ Erreur: ' + data.message);
                    location.reload();
                }
            })
            .catch(error => {
                console.error('Erreur:', error);
                alert('❌ Erreur lors de la validation du panier: ' + error.message);
                location.reload();
            });
    }
</script>
</body>
</html>
