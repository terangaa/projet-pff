<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Demandes d'ajout de produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Demandes d'ajout de produits</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

    <table class="table table-bordered mt-3">
        <thead>
        <tr>
            <th>ID</th>
            <th>Produit</th>
            <th>Message</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${demandes}">
            <td th:text="${d.id}"></td>
            <td th:text="${d.nomProduit}"></td>
            <td th:text="${d.message}"></td>
            <td th:text="${d.status}"></td>
            <td>
                <a th:href="@{'/produits/demande/admin/accepter/' + ${d.id}}"
                   class="btn btn-success btn-sm">✅ Accepter</a>
                <a th:href="@{'/produits/demande/admin/refuser/' + ${d.id}}"
                   class="btn btn-danger btn-sm">❌ Refuser</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
