<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{head :: head('Créer un utilisateur')}">
    <style>
        .photo-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-500);
            box-shadow: var(--shadow-lg);
            transition: all var(--transition-base);
        }
        .photo-preview:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--primary-500);
        }
    </style>
</head>
<body class="morphing-bg">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(135deg, var(--primary-800), var(--primary-600)); box-shadow: var(--shadow-lg);">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-seedling-fill fs-4"></i>
            <span>PAGAM</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-house-fill me-1"></i>Accueil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/utilisateurs}">
                        <i class="bi bi-people-fill me-1"></i>Utilisateurs
                    </a>
                </li>
            </ul>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light">
                <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
            </a>
        </div>
    </div>
</nav>

<div class="page-header gradient-animated">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h1 class="float-animation">
                    <i class="bi bi-person-plus-fill me-2"></i>Créer un nouvel utilisateur
                </h1>
                <p>Ajoutez un nouvel utilisateur à la plateforme</p>
            </div>
            <a th:href="@{/utilisateurs}" class="btn btn-light btn-lg glow-hover">
                <i class="bi bi-arrow-left me-2"></i>Retour
            </a>
        </div>
    </div>
</div>

<div class="container mb-5" style="position: relative; z-index: 1;">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="form-modern glass-card animate-on-scroll">
                <!-- Messages -->
                <div th:if="${successMessage}" class="alert alert-success animate-fade-in">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger animate-fade-in">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/utilisateurs/creer}" th:object="${utilisateur}" method="post" enctype="multipart/form-data" data-validate>
                    <div class="form-section">
                        <h3 class="form-section-title">
                            <i class="bi bi-person-fill me-2"></i>Informations personnelles
                        </h3>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="nom" class="form-label">Nom *</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                        <input type="text" id="nom" th:field="*{nom}" class="form-control" placeholder="Nom complet" required autocomplete="name"/>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="prenom" class="form-label">Prénom *</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                        <input type="text" id="prenom" th:field="*{prenom}" class="form-control" placeholder="Prénom" required autocomplete="given-name"/>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">Email *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="exemple@mail.com" required autocomplete="email"/>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3 class="form-section-title">
                            <i class="bi bi-shield-lock-fill me-2"></i>Sécurité
                        </h3>

                        <div class="form-group">
                            <label for="motDePasse" class="form-label">Mot de passe *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" id="motDePasse" th:field="*{motDePasse}" class="form-control" placeholder="Mot de passe" required autocomplete="new-password" data-strength/>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirmMotDePasse" class="form-label">Confirmer le mot de passe *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" id="confirmMotDePasse" th:field="*{confirmMotDePasse}" class="form-control" placeholder="Confirmer le mot de passe" required autocomplete="new-password"/>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3 class="form-section-title">
                            <i class="bi bi-person-badge-fill me-2"></i>Rôle et photo
                        </h3>

                        <div class="form-group">
                            <label for="role" class="form-label">Rôle *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                                <select id="role" th:field="*{role}" class="form-control" autocomplete="off">
                                    <option value="ADMIN">👑 ADMIN</option>
                                    <option value="AGRICULTEUR">🌱 AGRICULTEUR</option>
                                    <option value="ACHETEUR">🛒 ACHETEUR</option>
                                    <option value="DECIDEUR">📊 DECIDEUR</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group text-center">
                            <label for="photoFile" class="form-label fw-bold d-block mb-3">Photo de profil</label>
                            <div class="mb-3">
                                <img id="photoPreview" src="/images/default-avatar.png" alt="Prévisualisation" class="photo-preview"/>
                            </div>
                            <div class="image-upload-area" onclick="document.getElementById('photoFile').click()">
                                <i class="bi bi-cloud-upload" style="font-size: 2rem; color: var(--primary-500);"></i>
                                <p class="mb-0 mt-2">Cliquez pour sélectionner une photo</p>
                                <input type="file" id="photoFile" name="photoFile" class="d-none" accept="image/*" onchange="previewPhoto(event)"/>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-3 justify-content-end mt-4">
                        <a th:href="@{/utilisateurs}" class="btn btn-outline-secondary btn-lg">
                            <i class="bi bi-x-circle me-2"></i>Annuler
                        </a>
                        <button type="submit" class="btn btn-primary btn-lg btn-glow ripple-effect"
                                style="background: linear-gradient(135deg, var(--primary-600), var(--primary-500)); border: none;">
                            <i class="bi bi-check-circle me-2"></i>Créer l'utilisateur
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    function previewPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('photoPreview').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }
</script>
</body>
</html>
