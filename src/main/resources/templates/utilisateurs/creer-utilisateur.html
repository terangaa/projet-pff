<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{head :: head}">
    <meta charset="UTF-8">
    <title>Créer un utilisateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .photo-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #198754;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="bg-light py-4">
<div class="container">
    <!-- Bouton retour -->
    <div class="mb-4">
        <a th:href="@{/utilisateurs}" class="btn btn-outline-secondary shadow-sm">
            <i class="fas fa-arrow-left"></i> Retour à la liste des utilisateurs
        </a>
    </div>

    <!-- Formulaire de création -->
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-gradient bg-success text-white rounded-top-4">
            <h4 class="mb-0">
                <i class="fas fa-user-plus me-2"></i>Créer un nouvel utilisateur
            </h4>
        </div>
        <div class="card-body p-4">
            <!-- Messages -->
            <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-4" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <!-- Form -->
            <form th:action="@{/utilisateurs/creer}"
                  th:object="${utilisateur}"
                  method="post"
                  enctype="multipart/form-data"
                  autocomplete="on">

                <!-- Nom -->
                <div class="mb-3 input-group">
                    <span class="input-group-text bg-success text-white border-0"><i class="fas fa-user"></i></span>
                    <input type="text" th:field="*{nom}" class="form-control shadow-sm" placeholder="Entrer le nom complet" required autocomplete="name"/>
                </div>

                <!-- Prénom -->
                <div class="mb-3 input-group">
                    <span class="input-group-text bg-success text-white border-0"><i class="fas fa-user"></i></span>
                    <input type="text" th:field="*{prenom}" class="form-control shadow-sm" placeholder="Entrer le prénom" required autocomplete="given-name"/>
                </div>

                <!-- Email -->
                <div class="mb-3 input-group">
                    <span class="input-group-text bg-success text-white border-0"><i class="fas fa-envelope"></i></span>
                    <input type="email" th:field="*{email}" class="form-control shadow-sm" placeholder="exemple@mail.com" required autocomplete="email"/>
                </div>

                <!-- Mot de passe -->
                <div class="mb-3 input-group">
                    <span class="input-group-text bg-success text-white border-0"><i class="fas fa-lock"></i></span>
                    <input type="password" th:field="*{motDePasse}" class="form-control shadow-sm" placeholder="Entrez un mot de passe" required autocomplete="new-password"/>
                </div>

                <!-- Confirmer mot de passe -->
                <div class="mb-3 input-group">
                    <span class="input-group-text bg-success text-white border-0"><i class="fas fa-lock"></i></span>
                    <input type="password" th:field="*{confirmMotDePasse}" class="form-control shadow-sm" placeholder="Confirmez le mot de passe" required autocomplete="new-password"/>
                </div>

                <!-- Rôle -->
                <div class="mb-4 input-group">
                    <span class="input-group-text bg-success text-white border-0"><i class="fas fa-user-tag"></i></span>
                    <select th:field="*{role}" class="form-select shadow-sm" autocomplete="off">
                        <option value="ADMIN">👑 ADMIN</option>
                        <option value="AGRICULTEUR">🌱 AGRICULTEUR</option>
                        <option value="ACHETEUR">🛒 ACHETEUR</option>
                        <option value="DECIDEUR">📊 DECIDEUR</option>
                    </select>
                </div>

                <!-- Photo -->
                <div class="mb-4 text-center">
                    <label for="photoFile" class="form-label fw-bold d-block mb-2">Photo de profil</label>
                    <img id="photoPreview" src="/images/default-avatar.png" alt="Prévisualisation" class="photo-preview mb-3"/>
                    <input type="file" id="photoFile" name="photoFile" class="form-control shadow-sm" accept="image/*" onchange="previewPhoto(event)"/>
                </div>

                <!-- Boutons -->
                <div class="d-flex justify-content-between">
                    <a th:href="@{/utilisateurs}" class="btn btn-outline-secondary">
                        <i class="fas fa-times-circle"></i> Annuler
                    </a>
                    <button type="submit" class="btn btn-success shadow-sm">
                        <i class="fas fa-check-circle"></i> Créer
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Script de prévisualisation -->
<script>
    function previewPhoto(event) {
        const file = event.target.files[0];
        const preview = document.getElementById('photoPreview');
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            preview.src = '/images/default-avatar.png';
        }
    }
</script>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
