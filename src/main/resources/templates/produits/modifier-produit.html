<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier un produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg rounded-4">
        <div class="card-header bg-primary text-white d-flex align-items-center">
            <i class="bi bi-pencil-square me-2 fs-4"></i>
            <h4 class="mb-0">Modifier un produit</h4>
        </div>

        <div class="card-body p-4">

            <!-- Alertes -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/produits/modifier/{id}(id=${produit.id})}" th:object="${produit}"
                  method="post" enctype="multipart/form-data" novalidate>

                <!-- Nom -->
                <div class="mb-3">
                    <label for="nom" class="form-label fw-semibold">Nom du produit</label>
                    <input type="text" id="nom" th:field="*{nom}" class="form-control" required/>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Description</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <!-- Prix -->
                <div class="mb-3">
                    <label for="prixUnitaire" class="form-label fw-semibold">Prix (FCFA)</label>
                    <input type="number" id="prixUnitaire" th:field="*{prix}" class="form-control" min="0" step="100" required/>
                </div>

                <!-- Quantité -->
                <div class="mb-3">
                    <label for="quantite" class="form-label fw-semibold">Quantité</label>
                    <input type="number" id="quantite" th:field="*{quantite}" class="form-control" min="1" step="1" required/>
                </div>

                <!-- Total calculé -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Total (FCFA)</label>
                    <input type="text" id="prixTotal" class="form-control" readonly/>
                </div>

                <!-- Image -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Image actuelle</label><br>
                    <img th:src="@{${produit.image} != null && ${produit.image} != '' ? '/images/produits/' + ${produit.image} : '/images/default.png'}"
                         alt="Image produit"
                         class="img-thumbnail"
                         style="max-width:150px;">
                    <label for="image" class="form-label fw-semibold mt-2">Changer l’image</label>
                    <input type="file" id="image" name="imageFile" class="form-control shadow-sm" accept="image/*" onchange="previewImage(event)">
                    <img id="preview" class="img-thumbnail mt-2" style="max-width:150px; display:none;">
                </div>

                <!-- Producteur -->
                <div class="mb-3">
                    <label for="agriculteur" class="form-label">Producteur</label>
                    <select id="agriculteur" name="agriculteurId" class="form-select" required>
                        <option value="" th:selected="${produit.agriculteur == null}">
                            -- Sélectionner un producteur --
                        </option>
                        <option th:each="p : ${agriculteurs}"
                                th:value="${p.id}"
                                th:text="${p.agriculteur != null} ? ${p.agriculteur.prenom} + ' ' + ${p.nom} : 'Aucun agriculteur'">
                        </option>
                    </select>
                </div>
                <!-- Boutons -->
                <div class="d-flex justify-content-end mt-4">
                    <a th:href="@{/produits}" class="btn btn-outline-secondary me-2">
                        <i class="bi bi-arrow-left"></i> Retour
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle"></i> Enregistrer
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Calcul automatique du total
    const inputPrix = document.getElementById('prixUnitaire');
    const inputQuantite = document.getElementById('quantite');
    const inputTotal = document.getElementById('prixTotal');

    function updateTotal() {
        const prix = parseFloat(inputPrix.value) || 0;
        const quantite = parseInt(inputQuantite.value) || 0;
        inputTotal.value = (prix * quantite).toLocaleString('fr-FR', { style: 'decimal', maximumFractionDigits: 0 });
    }

    inputPrix.addEventListener('input', updateTotal);
    inputQuantite.addEventListener('input', updateTotal);
    document.addEventListener('DOMContentLoaded', updateTotal);

    // Prévisualisation image
    function previewImage(event) {
        const output = document.getElementById('preview');
        if(event.target.files.length === 0) {
            output.style.display = 'none';
            output.src = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = function() {
            output.src = reader.result;
            output.style.display = 'inline-block';
        }
        reader.readAsDataURL(event.target.files[0]);
    }
</script>
</body>
</html>
