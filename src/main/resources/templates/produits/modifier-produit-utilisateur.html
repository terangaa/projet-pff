<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier un produit - Utilisateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-lg rounded-4">
        <div class="card-header bg-primary text-white d-flex align-items-center">
            <i class="bi bi-pencil-square me-2 fs-4"></i>
            <h4 class="mb-0">Modifier un produit</h4>
        </div>

        <div class="card-body p-4">

                <!-- Nom du produit en sélection -->
                <<!-- Nom du produit (lecture seule pour l'utilisateur) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nom du produit</label>
                    <input type="text" th:value="${produit.nom}" class="form-control" readonly>
                </div>

                <!-- Description (lecture seule) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea class="form-control" rows="3" readonly th:text="${produit.description}"></textarea>
                </div>

                <!-- Prix (lecture seule) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Prix (FCFA)</label>
                    <input type="number" class="form-control" th:value="${produit.prix}" readonly>
                </div>

                <!-- Quantité (modifiable) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Quantité</label>
                    <input type="number" th:field="*{quantite}" class="form-control" min="1" required/>
                </div>

                <!-- Total calculé dynamiquement -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Total (FCFA)</label>
                    <input type="text" id="prixTotal" class="form-control" readonly th:value="${produit.prix * produit.quantite}"/>
                </div>

                <!-- Producteur (lecture seule) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Producteur</label>
                    <input type="text" th:value="${produit.agriculteur.prenom + ' ' + produit.agriculteur.nom}" class="form-control" readonly>
                </div>

                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const inputPrix = document.getElementById('prixUnitaire');
    const inputQuantite = document.getElementById('quantite');
    const inputTotal = document.getElementById('prixTotal');

    function updateTotal() {
        const prix = parseFloat(inputPrix.value) || 0;
        const quantite = parseInt(inputQuantite.value) || 0;
        inputTotal.value = (prix * quantite).toLocaleString('fr-FR', {minimumFractionDigits:0});
    }

    inputPrix.addEventListener('change', updateTotal);
    inputQuantite.addEventListener('input', updateTotal);

    document.addEventListener('DOMContentLoaded', updateTotal);
</script>
</body>
</html>
