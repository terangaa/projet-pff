<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head('Produits')}">
    <!-- CSRF meta -->
    <meta th:if="${_csrf != null}" th:attr="name='_csrf', content=${_csrf.token}"/>
    <meta th:if="${_csrf != null}" th:attr="name='_csrf_header', content=${_csrf.headerName}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(135deg, var(--primary-800), var(--primary-600)); box-shadow: var(--shadow-lg);">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-seedling-fill fs-4"></i>
            <span>PAGAM</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-house-fill me-1"></i>Accueil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/produits}">
                        <i class="bi bi-shop me-1"></i>Produits
                    </a>
                </li>
            </ul>

            <div class="d-flex gap-2 align-items-center">
                <form th:action="@{/produits}" method="get" class="search-bar">
                    <i class="bi bi-search search-icon"></i>
                    <input name="q" th:value="${q}" type="search" class="form-control" placeholder="Rechercher un produit..." style="min-width: 250px;">
                </form>
                <a th:href="@{/panier}" class="btn btn-outline-light position-relative">
                    <i class="bi bi-cart3"></i> Panier
                    <span id="badgePanier" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          th:text="${panier?.items != null ? #lists.size(panier.items) : 0}">0
                    </span>
                </a>
                <a th:href="@{/auth/logout}" class="btn btn-outline-light">
                    <i class="bi bi-box-arrow-right"></i> Déconnexion
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="page-header gradient-animated">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h1 class="float-animation"><i class="bi bi-shop me-2"></i>Produits disponibles</h1>
                <p>Découvrez notre sélection de produits agricoles frais et de qualité</p>
            </div>
            <a th:if="${role == 'ADMIN' or role == 'AGRICULTEUR'}"
               class="btn btn-light btn-lg glow-hover btn-glow" th:href="@{/produits/creer}">
                <i class="bi bi-plus-circle me-2"></i>Ajouter un produit
            </a>
        </div>
    </div>
</div>

<div class="container">

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
        <div class="col" th:each="p : ${produits}">
            <div class="product-card card h-100 position-relative card-hover-effect animate-on-scroll">
                <div class="position-relative shine-effect" style="overflow: hidden;">
                    <img th:src="${p.image != null ? (p.image.startsWith('/images/') ? p.image : '/images/produits/' + p.image) : '/images/default.png'}"
                         alt="Produit" class="product-image">

                    <span th:if="${role != 'ADMIN'}" class="product-badge stock pulse-animation"
                          th:text="${p.stock >= 1 ? 'Stock: ' + p.stock + ' kg' : 'Stock: ' + (p.stock*1000) + ' g'}">
                    </span>

                    <span th:if="${p.dateCreation != null and #dates.daysBetween(p.dateCreation, #dates.createNow()) <= 7}"
                          class="product-badge new float-animation" style="left: auto; right: 15px;">Nouveau</span>
                </div>

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold gradient-text" th:text="${p.nom}"></h5>
                    <p class="text-muted mb-2 small">
                        <i class="bi bi-person-fill me-1"></i>
                        <span th:text="${p.agriculteur != null ? p.agriculteur.prenom + ' ' + p.agriculteur.nom : 'Inconnu'}"></span>
                    </p>
                    <p class="card-text text-muted mb-3 small"
                       th:text="${#strings.abbreviate(p.description, 80)}"
                       style="flex-grow: 1;"></p>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-4 fw-bold text-primary neon-text" th:text="${p.prix ?: 0} + ' FCFA'"></span>
                    </div>

                    <button class="btn btn-primary w-100 mt-auto btn-glow ripple-effect"
                            th:onclick="'addToCart(' + ${p.id} + ',1)'"
                            style="background: linear-gradient(135deg, var(--primary-600), var(--primary-500)); border: none;">
                        <i class="bi bi-cart-plus me-2"></i>Ajouter au panier
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(produits)}" class="empty-state">
        <i class="bi bi-inbox"></i>
        <h3>Aucun produit trouvé</h3>
        <p>Il n'y a pas de produits disponibles pour le moment.</p>
        <a th:if="${role == 'ADMIN' or role == 'AGRICULTEUR'}"
           th:href="@{/produits/creer}"
           class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>Ajouter le premier produit
        </a>
    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    // Toast
    function showToast(message, type='success') {
        const container = document.getElementById('toastContainer');
        const icon = type === 'success' ? '✔️' : '❌';
        const toastEl = document.createElement('div');
        toastEl.className = `toast align-items-center text-bg-${type} border-0 mb-2`;
        toastEl.innerHTML = `<div class="d-flex">
            <div class="toast-body">${icon} ${message}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>`;
        container.appendChild(toastEl);
        const toast = new bootstrap.Toast(toastEl, { delay: 2000 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    // Ajouter au panier - VERSION AMÉLIORÉE avec gestion CSRF robuste
    function addToCart(productId, quantite) {
        // Méthode 1: Récupérer depuis les meta tags (version corrigée)
        let csrfToken = document.querySelector("meta[name='_csrf']")?.getAttribute('content');
        let csrfHeader = document.querySelector("meta[name='_csrf_header']")?.getAttribute('content');

        console.log('CSRF Token (méthode 1):', csrfToken);
        console.log('CSRF Header (méthode 1):', csrfHeader);

        // Méthode 2: Si pas trouvé, chercher dans les forms cachés
        if (!csrfToken) {
            const csrfInput = document.querySelector('input[name="_csrf"]');
            if (csrfInput) {
                csrfToken = csrfInput.value;
                csrfHeader = 'X-CSRF-TOKEN';
                console.log('CSRF Token (méthode 2):', csrfToken);
            }
        }

        // Méthode 3: Si toujours pas trouvé, utiliser une valeur par défaut
        if (!csrfToken) {
            console.warn('CSRF token non trouvé, utilisation de fallback');
            // Vous pouvez temporairement désactiver CSRF dans SecurityConfig pour tester
        }

        const headers = {
            'Content-Type': 'application/x-www-form-urlencoded'
        };

        // Ajouter CSRF seulement si disponible
        if (csrfHeader && csrfToken) {
            headers[csrfHeader] = csrfToken;
        }

        // Préparer les données avec CSRF
        const formData = new URLSearchParams();
        if (csrfToken) {
            formData.append('_csrf', csrfToken);
        }

        console.log('Envoi requête vers:', `/panier/ajouter/${productId}?quantite=${quantite}`);
        console.log('Headers:', headers);

        fetch(`/panier/ajouter/${productId}?quantite=${quantite}`, {
            method: 'POST',
            headers: headers,
            body: formData,
            credentials: 'include'
        })
            .then(response => {
                console.log('Status HTTP:', response.status);
                console.log('URL:', response.url);

                if (!response.ok) {
                    // Essayer de lire le message d'erreur détaillé
                    return response.text().then(text => {
                        console.error('Réponse erreur:', text);
                        throw new Error(`Erreur HTTP ${response.status}: ${text.substring(0, 100)}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log('Réponse serveur:', data);
                if(data.success) {
                    showToast('Produit ajouté au panier 🌿', 'success');
                    document.getElementById('badgePanier').innerText = data.totalItems;
                } else {
                    showToast(data.message || 'Erreur lors de l’ajout au panier ❌', 'danger');
                }
            })
            .catch(error => {
                console.error('Erreur complète:', error);
                showToast('Erreur: ' + error.message, 'danger');
            });
    }

    // Debug au chargement
    document.addEventListener('DOMContentLoaded', function() {
        console.log('=== DEBUG CSRF ===');
        console.log('Meta CSRF:', document.querySelector("meta[name='_csrf']"));
        console.log('Meta CSRF Header:', document.querySelector("meta[name='_csrf_header']"));
        console.log('Tous les meta tags:', document.querySelectorAll('meta'));
    });
</script>

</body>
</html>
