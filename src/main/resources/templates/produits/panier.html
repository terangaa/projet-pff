<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier 🛒</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.7.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body { font-family:'Poppins',sans-serif; background:#e8f5e9; }
        .card { border-radius:16px; }
        .card h5 { color:#2e7d32; font-weight:700; }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4 text-center">🛒 Mon Panier</h2>

    <div th:if="${#lists.isEmpty(articles)}" class="alert alert-warning text-center">
        Votre panier est vide.
    </div>

    <div th:if="${!#lists.isEmpty(articles)}" class="card shadow-sm p-3">
        <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="article : ${articles}">
                <span th:text="${article.nom}"></span>
                <span th:text="${article.quantite} + ' pcs'"></span>
            </li>
        </ul>
        <div class="d-flex justify-content-between fw-bold">
            <span>Total Articles :</span>
            <span th:text="${total}"></span>
        </div>
        <a href="/checkout" class="btn btn-success w-100 mt-3">Passer à la commande</a>
    </div>
</div>

</body>
</html>
