<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un produit - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Arrière-plan animé type plateforme e-commerce */
        body {
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            position: relative;
            overflow: hidden;
        }

        /* Bulles animées */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            animation: float 20s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }

        /* Card style moderne glass */
        .card {
            position: relative;
            z-index: 1;
            border-radius: 2rem;
            background-color: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            padding: 2rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }

        /* Inputs & Buttons */
        .form-label { font-weight: 500; }
        .input-group-text { background-color: #e9ecef; border-radius: 0.5rem; }
        .btn-primary {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            border: none;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,0,0,0.25); background: linear-gradient(135deg, #6610f2, #0d6efd); }
        .btn-outline-secondary { border-radius: 50px; }
        #prixTotal { font-size: 1.25rem; font-weight: bold; color: #0d6efd; text-align: center; }
        .form-control:focus { box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25); }

        /* Preview image hover */
        #preview {
            max-height: 180px;
            margin-top: 10px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        #preview:hover { transform: scale(1.08); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<!-- Bulles -->
<div class="bubble" style="width: 60px; height:60px; left:10%; animation-duration:25s;"></div>
<div class="bubble" style="width: 100px; height:100px; left:50%; animation-duration:35s;"></div>
<div class="bubble" style="width: 80px; height:80px; left:80%; animation-duration:30s;"></div>
<div class="bubble" style="width: 50px; height:50px; left:30%; animation-duration:40s;"></div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg">
        <div class="text-center mb-4">
            <i class="bi bi-box-seam fs-1 text-primary"></i>
            <h2 class="mt-2 fw-bold">Créer un nouveau produit</h2>
            <p class="text-muted">Veuillez remplir les informations ci-dessous</p>
        </div>

        <!-- Messages -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/produits/creer-admin}" th:object="${produit}" method="post" enctype="multipart/form-data">

            <!-- Nom -->
            <div class="mb-3">
                <label for="nom" class="form-label">Nom du produit</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-tag"></i></span>
                    <input type="text" id="nom" th:field="*{nom}" class="form-control" placeholder="Ex : Tomates bio" required/>
                </div>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                          placeholder="Ex : Tomates fraîches cultivées sans pesticides"></textarea>
            </div>

            <!-- Prix unitaire -->
            <div class="mb-3">
                <label for="prix" class="form-label">Prix unitaire (FCFA)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                    <input type="number" id="prix" th:field="*{prix}" step="0.01" min="0"
                           class="form-control" placeholder="Ex : 500" required oninput="updatePrixTotal()"/>
                </div>
            </div>

            <!-- Quantité -->
            <div class="mb-3">
                <label for="quantite" class="form-label">Quantité</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-stack"></i></span>
                    <input type="number" id="quantite" th:field="*{quantite}" class="form-control"
                           placeholder="Ex : 50" min="1" required oninput="updatePrixTotal()"/>
                </div>
            </div>

            <!-- Prix total -->
            <div class="mb-3">
                <label class="form-label">Prix total estimé</label>
                <input type="text" id="prixTotal" class="form-control bg-light" readonly>
            </div>

            <!-- Image -->
            <div class="mb-3">
                <label for="image" class="form-label">Image du produit</label>
                <input type="file" id="image" name="imageFile" class="form-control" accept="image/*"
                       onchange="previewImage(event)"/>
                <img id="preview" src="#" alt="Aperçu de l’image" class="d-none"/>
            </div>

            <!-- Producteur -->
            <div class="mb-4">
                <label for="agriculteur" class="form-label">Sélectionner un producteur (facultatif)</label>
                <select id="agriculteur" name="agriculteurId" class="form-select">
                    <option value="">-- Aucun producteur --</option>
                    <option th:each="prod : ${agriculteurs}"
                            th:value="${prod.id}"
                            th:text="${prod.prenom + ' ' + prod.nom}"></option>
                </select>
            </div>

            <!-- Boutons -->
            <div class="d-flex justify-content-between">
                <a th:href="@{/produits}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Retour
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Créer
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('preview');
        if(input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.classList.remove('d-none'); };
            reader.readAsDataURL(input.files[0]);
        } else { preview.src="#"; preview.classList.add('d-none'); }
    }
    function updatePrixTotal() {
        const prix = parseFloat(document.getElementById('prix').value) || 0;
        const quantite = parseInt(document.getElementById('quantite').value) || 0;
        document.getElementById('prixTotal').value = (prix * quantite).toLocaleString('fr-FR') + " FCFA";
    }
</script>
</body>
</html>
