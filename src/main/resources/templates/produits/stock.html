<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head('Gestion du Stock')}">
</head>
<body class="particle-bg">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(135deg, var(--primary-800), var(--primary-600)); box-shadow: var(--shadow-lg);">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-seedling-fill fs-4"></i>
            <span>PAGAM</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-house-fill me-1"></i>Accueil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/produits/stock}">
                        <i class="bi bi-box-seam me-1"></i>Stock
                    </a>
                </li>
            </ul>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light">
                <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
            </a>
        </div>
    </div>
</nav>

<div class="page-header gradient-animated">
    <div class="container">
        <h1 class="float-animation">
            <i class="bi bi-box-seam me-2"></i>Gestion du Stock
        </h1>
        <p>Gérez les stocks de tous vos produits</p>
    </div>
</div>

<div class="container mb-5">
    <div id="message"></div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="p, iterStat : ${produits}" th:data-id="${p.id}">
            <div class="card-modern product-card magnetic-card animate-on-scroll" th:style="'animation-delay: ' + ${iterStat.index * 0.1} + 's;'">
                <div class="position-relative">
                    <img th:src="${p.image != null ? p.image : '/images/produit-placeholder.png'}"
                         class="product-image" th:alt="${p.nom}">
                    <span class="product-badge stock" th:text="'Stock: ' + ${p.stock} + ' kg'"></span>
                </div>
                <div class="card-body">
                    <h5 class="card-title gradient-text" th:text="${p.nom}"></h5>
                    <p class="text-muted mb-3">
                        <i class="bi bi-person-fill me-1"></i>
                        <span th:text="${p.agriculteur != null ? p.agriculteur.prenom + ' ' + p.agriculteur.nom : 'Inconnu'}"></span>
                    </p>
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <label class="form-label mb-0">Nouveau stock:</label>
                        <input type="number" class="form-control input-stock" th:value="${p.stock}" min="0" style="max-width: 120px;">
                    </div>
                    <button type="button" class="btn btn-primary w-100 btn-update-stock btn-glow"
                            style="background: linear-gradient(135deg, var(--primary-600), var(--primary-500)); border: none;">
                        <i class="bi bi-save me-2"></i>Mettre à jour
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(produits)}" class="empty-state animate-on-scroll">
        <i class="bi bi-box-seam" style="font-size: 5rem; color: var(--gray-400);"></i>
        <h3 class="gradient-text">Aucun produit trouvé</h3>
        <p class="text-muted">Les produits apparaîtront ici</p>
    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    document.querySelectorAll('.btn-update-stock').forEach(btn => {
        btn.addEventListener('click', function() {
            const col = this.closest('.col');
            const id = col.dataset.id;
            const stockInput = col.querySelector('.input-stock');
            const nouveauStock = stockInput.value;

            fetch(`/modifier-stock/${id}?stock=${nouveauStock}`, { method: 'POST' })
                .then(res => res.text())
                .then(data => {
                    if(data === 'OK') {
                        col.querySelector('.product-badge').textContent = 'Stock: ' + nouveauStock + ' kg';
                        if (window.PAGAM && window.PAGAM.showToast) {
                            window.PAGAM.showToast('Stock mis à jour avec succès !', 'success');
                        }
                    } else {
                        if (window.PAGAM && window.PAGAM.showToast) {
                            window.PAGAM.showToast('Erreur lors de la mise à jour', 'error');
                        }
                    }
                })
                .catch(() => {
                    if (window.PAGAM && window.PAGAM.showToast) {
                        window.PAGAM.showToast('Erreur lors de la mise à jour', 'error');
                    }
                });
        });
    });
</script>
</body>
</html>
