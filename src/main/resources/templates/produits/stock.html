<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>📦 Gestion du Stock des Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .product-card { transition: all 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .product-img { height: 150px; object-fit: cover; border-radius: 8px; }
        #message { position: fixed; top: 20px; right: 20px; z-index: 1000; min-width: 250px; }
        .input-stock { max-width: 100px; }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>📦 Gestion du Stock des Produits</h2>

    <div id="message"></div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="p : ${produits}" th:data-id="${p.id}">
            <div class="card h-100 product-card">
                <img th:src="${p.image != null ? p.image : '/images/produit-placeholder.png'}"
                     class="card-img-top product-img" th:alt="${p.nom}">
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${p.nom}">Nom Produit</h5>
                    <p class="card-text" th:text="'Agriculteur : ' + (p.agriculteur != null ? p.agriculteur.prenom + ' ' + p.agriculteur.nom : 'Inconnu')"></p>
                    <p class="card-text">Stock actuel : <span class="stock" th:text="${p.stock}">0</span></p>
                    <div class="d-flex justify-content-center mt-2">
                        <input type="number" class="form-control me-2 input-stock" th:value="${p.stock}" min="0">
                        <button type="button" class="btn btn-success btn-sm btn-update-stock">💾</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <a href="/dashboard" class="btn btn-outline-primary mt-4">← Retour au tableau de bord</a>
</div>

<!-- Toast container -->
<div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Toasts
    function showToast(message, type='success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast align-items-center text-bg-${type} border-0`;
        toast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-${type==='success'?'check-circle':'exclamation-triangle'} me-2"></i>
                    ${message}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        `;
        container.appendChild(toast);
        const bsToast = new bootstrap.Toast(toast, { delay: 4000 });
        bsToast.show();
        toast.addEventListener('hidden.bs.toast', () => toast.remove());
    }

    // Mettre à jour le stock dans le DOM
    function updateStockProduit(produitId, nouveauStock) {
        const produitCard = document.querySelector(`.col[data-id='${produitId}']`);
        if(produitCard) {
            produitCard.querySelector('.stock').textContent = nouveauStock;
            produitCard.querySelector('.input-stock').value = nouveauStock;
        }
    }

    // Update stock button
    document.querySelectorAll('.btn-update-stock').forEach(btn => {
        btn.addEventListener('click', function() {
            const col = this.closest('.col');
            const id = col.dataset.id;
            const stockInput = col.querySelector('.input-stock');
            const nouveauStock = stockInput.value;

            fetch(`/modifier-stock/${id}?stock=${nouveauStock}`, { method: 'POST' })
                .then(res => res.text())
                .then(data => {
                    if(data === 'OK') {
                        updateStockProduit(id, nouveauStock);
                        showToast('Stock mis à jour !', 'success');
                    } else {
                        showToast('Erreur lors de la mise à jour du stock', 'danger');
                    }
                })
                .catch(() => showToast('Erreur lors de la mise à jour du stock', 'danger'));
        });
    });
</script>
</body>
</html>
