<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>📦 Gestion du Stock des Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .product-card { transition: all 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .product-img { height: 150px; object-fit: cover; border-radius: 8px; }
        #message { position: fixed; top: 20px; right: 20px; z-index: 1000; min-width: 250px; }
        .input-stock { max-width: 100px; }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>📦 Gestion du Stock des Produits</h2>
    <div id="message"></div>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="p : ${produits}" th:data-id="${p.id}">
            <div class="card h-100 product-card">
                <img th:src="${p.image != null ? p.image : '/images/produit-placeholder.png'}"
                     class="card-img-top product-img" th:alt="${p.nom}">
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${p.nom}">Nom Produit</h5>
                    <p class="card-text" th:text="'Agriculteur : ' + (p.agriculteur != null ? p.agriculteur.prenom + ' ' + p.agriculteur.nom : 'Inconnu')"></p>
                    <p class="card-text">Stock actuel : <span class="stock" th:text="${p.stock}">0</span></p>
                    <div class="d-flex justify-content-center mt-2">
                        <input type="number" class="form-control me-2 input-stock" th:value="${p.stock}" min="0">
                        <button type="button" class="btn btn-success btn-sm btn-update">💾</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <a href="/dashboard" class="btn btn-outline-primary mt-4">← Retour au tableau de bord</a>
</div>

<script>
    document.querySelectorAll('.btn-update').forEach(button => {
        button.addEventListener('click', function() {
            const col = this.closest('.col');
            const id = col.dataset.id;
            const stockInput = col.querySelector('.input-stock');
            const nouveauStock = stockInput.value;

            fetch(`/modifier-stock/${id}?stock=${nouveauStock}`, { method: 'POST' })
                .then(response => response.text())
                .then(data => {
                    const messageDiv = document.getElementById('message');
                    if (data === 'OK') {
                        col.querySelector('.stock').textContent = nouveauStock;
                        messageDiv.innerHTML = `<div class="alert alert-success shadow">✅ Stock mis à jour !</div>`;
                    } else {
                        messageDiv.innerHTML = `<div class="alert alert-danger shadow">❌ Erreur lors de la mise à jour.</div>`;
                    }
                    setTimeout(() => messageDiv.innerHTML = '', 3000);
                })
                .catch(() => {
                    const messageDiv = document.getElementById('message');
                    messageDiv.innerHTML = `<div class="alert alert-danger shadow">❌ Erreur lors de la mise à jour.</div>`;
                    setTimeout(() => messageDiv.innerHTML = '', 3000);
                });
        });
    });
</script>
</body>
</html>
