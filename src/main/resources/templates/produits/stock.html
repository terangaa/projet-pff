<!-- src/main/resources/templates/produits/stock.html -->
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stock des Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>📦 Gestion du Stock des Produits</h2>

    <table class="table table-striped mt-4 align-middle">
        <thead class="table-light">
        <tr>
            <th>Nom</th>
            <th>Agriculteur</th>
            <th>Stock actuel</th>
            <th>Mettre à jour</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${produits}">
            <td th:text="${p.nom}"></td>
            <td th:text="${p.agriculteur != null ? p.agriculteur.prenom + ' ' + p.agriculteur.nom : 'Inconnu'}"></td>
            <td th:text="${p.stock}"></td>
            <td>
                <form th:action="@{/produits/modifier-stock/{id}(id=${p.id})}" method="post" class="d-flex">
                    <input type="number" name="stock" th:value="${p.stock}" min="0" class="form-control me-2" required>
                    <button type="submit" class="btn btn-primary btn-sm">✅</button>
                </form>
            </td>
        </tr>
        </tbody>
        <tfoot>
        <tr class="table-secondary">
            <td colspan="3"><strong>Total Stock</strong></td>
            <td th:text="${totalStock}"></td>
        </tr>
        </tfoot>
    </table>

    <a href="/produits" class="btn btn-outline-secondary mt-3">← Retour aux produits</a>
</div>
</body>
</html>
