<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue Produits - Moderne Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f5f6fa; font-family: 'Segoe UI', sans-serif; }

        /* Navbar */
        .navbar-brand { font-size: 1.6rem; font-weight: bold; }

        /* Barre de recherche */
        #searchInput {
            max-width: 450px;
            margin: auto;
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        #searchInput:focus { box-shadow: 0 6px 18px rgba(0,0,0,0.2); border-color: #0d6efd; }

        /* Cartes produits */
        .product-card {
            position: relative;
            background: linear-gradient(145deg,#fff,#f9f9f9);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08), 0 0 10px rgba(255,193,7,0.1);
        }
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), 0 0 15px rgba(255,193,7,0.25);
        }
        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.3s ease;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        .product-card:hover img { transform: scale(1.05); filter: brightness(1.1); }

        /* Overlay description */
        .product-overlay {
            position: absolute;
            bottom: -100%;
            width: 100%;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: bottom 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            border-radius: 0 0 15px 15px;
        }
        .product-card:hover .product-overlay { bottom: 0; opacity: 1; }
        .product-overlay p { font-size: 0.85rem; text-align: center; margin-bottom: 8px; }
        .product-overlay .price { font-size: 1.2rem; font-weight: bold; color: #ffc107; margin-bottom: 10px; }

        /* Badges pulsants */
        .badge-stock, .badge-new {
            position: absolute;
            top: 12px;
            font-size: 0.85rem;
            padding: 0.4em 0.7em;
            border-radius: 8px;
            font-weight: 600;
            color: #fff;
            animation: pulseBadge 1.8s infinite ease-in-out;
        }
        .badge-stock { background-color: #dc3545; left: 12px; }
        .badge-new { background-color: #198754; right: 12px; }
        @keyframes pulseBadge {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }

        /* Card body */
        .card-body { padding: 12px; text-align: center; }
        .card-body h6 { font-weight: 600; font-size: 1rem; margin-bottom: 5px; }
        .card-body .price { color: #28a745; font-weight: bold; font-size: 1.05rem; }

        /* Boutons flottants */
        .btn-float {
            position: absolute;
            top: 12px;
            right: 12px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #fff;
            background: #0d6efd;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
        }
        .btn-float:hover { background-color: #0b5ed7; transform: scale(1.15); }

        /* Ajouter au panier */
        .product-overlay .btn-cart {
            width: 100%;
            border-radius: 50px;
            background: linear-gradient(90deg, #ffc107, #ffca2c);
            border: none;
            color: #212529;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
        }
        .product-overlay .btn-cart:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #e0a800, #ffc107);
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        /* Pagination arrondie */
        .pagination .page-item .page-link {
            border-radius: 50% !important;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 4px;
            color: #0d6efd;
        }
        .pagination .page-item.active .page-link { background-color: #0d6efd; color: #fff; }
        .pagination .page-item .page-link:hover { background-color: #0d6efd; color: #fff; }

        /* Animation d'apparition */
        .product-item { opacity: 0; transform: translateY(20px); transition: all 0.6s ease; }
        .product-item.visible { opacity: 1; transform: translateY(0); }

        /* Overlay mini-images */
        .overlay-images {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .overlay-images img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }

    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">🌾 Plateforme Agricole</a>
        <div class="d-flex align-items-center ms-auto">
            <span class="text-white me-3">Connecté : <b th:text="${email}"></b></span>
            <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">Accueil</a>
            <a href="/auth/logout" class="btn btn-outline-light btn-sm">Déconnexion</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Barre de recherche -->
    <div class="mb-4 text-center">
        <input type="text" id="searchInput" class="form-control" placeholder="Rechercher un produit...">
    </div>

    <!-- Grille produits -->
    <div class="row g-4" id="productGrid" th:if="${!#lists.isEmpty(produits)}">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3 product-item"
             th:each="produit : ${produits}"
             th:data-name="${produit.nom.toLowerCase()}">

            <div class="product-card shadow-sm h-100 position-relative">

                <!-- Image principale -->
                <img th:if="${produit.image != null}" th:src="@{${produit.image}}" alt="Produit">

                <!-- Badges -->
                <span th:if="${produit.stock == 0}" class="badge-stock">Rupture</span>
                <span th:if="${produit.nouveau}" class="badge-new">Nouveau</span>

                <!-- Bouton favoris -->
                <button class="btn-float"><i class="bi bi-heart"></i></button>

                <!-- Overlay -->
                <div class="product-overlay">
                    <div class="overlay-images" th:if="${produit.image != null}">
                        <img th:src="@{${produit.image}}" alt="Aperçu">
                    </div>
                    <p th:text="${produit.description}"></p>
                    <span class="price mb-2" th:text="${produit.prix + ' FCFA'}"></span>
                    <form th:action="@{/achats/ajouter}" method="post" class="w-100">
                        <input type="hidden" name="idProduit" th:value="${produit.id}" />
                        <div class="input-group">
                            <input type="number" name="quantite" class="form-control" min="1" th:attr="max=${produit.stock}" value="1" required>
                            <button type="submit" class="btn-cart" th:disabled="${produit.stock == 0}">
                                <i class="bi bi-cart-plus"></i> Ajouter panier
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-body mt-2">
                    <h6 class="fw-bold" th:text="${produit.nom}">Nom Produit</h6>
                    <span class="price" th:text="${produit.prix + ' FCFA'}">0 FCFA</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}" aria-label="Pagination" class="mt-4">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/produits(page=${currentPage - 1}, q=${query})}">&laquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/produits(page=${i}, q=${query})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/produits(page=${currentPage + 1}, q=${query})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>

<!-- Footer -->
<footer class="bg-primary text-white text-center py-3 mt-5 shadow-sm">
    <p class="mb-0">© 2025 - Plateforme Agricole</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const searchInput = document.getElementById('searchInput');
    const products = document.querySelectorAll('.product-item');

    // Filtrage instantané
    searchInput.addEventListener('input', () => {
        const term = searchInput.value.toLowerCase();
        products.forEach(p => { p.style.display = p.dataset.name.includes(term) ? 'block' : 'none'; });
    });

    // Animation apparition au scroll
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => { if(entry.isIntersecting){ entry.target.classList.add('visible'); } });
    }, { threshold: 0.1 });
    products.forEach(p => observer.observe(p));
</script>
</body>
</html>
