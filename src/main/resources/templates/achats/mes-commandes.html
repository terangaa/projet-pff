<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head('Mes Commandes')}">
</head>
<body class="particle-bg">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(135deg, var(--primary-800), var(--primary-600)); box-shadow: var(--shadow-lg);">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-seedling-fill fs-4"></i>
            <span>PAGAM</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-house-fill me-1"></i>Accueil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/mes-commandes}">
                        <i class="bi bi-bag-check me-1"></i>Mes Commandes
                    </a>
                </li>
            </ul>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light">
                <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
            </a>
        </div>
    </div>
</nav>

<div class="page-header gradient-animated">
    <div class="container">
        <h1 class="float-animation">
            <i class="bi bi-bag-check me-2"></i>Mes Commandes
        </h1>
        <p>Suivez l'état de toutes vos commandes</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="commande, iterStat : ${commandes}">
            <div class="card-modern product-card magnetic-card animate-on-scroll" th:style="'animation-delay: ' + ${iterStat.index * 0.1} + 's;'">
                <div class="position-relative">
                    <img th:src="${commande.produit != null && commande.produit.image != null ? commande.produit.image : '/images/produit-placeholder.png'}"
                         class="product-image" th:alt="${commande.produit != null ? commande.produit.nom : 'Produit'}">
                    <span class="product-badge" th:classappend="${commande.statut == 'VALIDEE'} ? 'completed' : (${commande.statut == 'EN_COURS'} ? 'processing' : 'cancelled')"
                          th:text="${commande.statut}"></span>
                </div>
                <div class="card-body">
                    <h5 class="card-title gradient-text" th:text="${commande.produit != null ? commande.produit.nom : 'Produit inconnu'}"></h5>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-muted">Quantité:</span>
                        <span class="badge bg-secondary" th:text="${commande.quantite}"></span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-muted">Prix unitaire:</span>
                        <span class="fw-bold" th:text="${#numbers.formatDecimal(commande.prix,1,2)} + ' FCFA'"></span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-bold">Total:</span>
                        <span class="fs-5 fw-bold gradient-text" th:text="${#numbers.formatDecimal(commande.montantTotal,1,2)} + ' FCFA'"></span>
                    </div>
                    <p class="text-muted small mb-0">
                        <i class="bi bi-calendar me-1"></i>
                        <span th:text="${commande.dateCommande != null ? #temporals.format(commande.dateCommande,'dd/MM/yyyy HH:mm') : '-'}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(commandes)}" class="empty-state animate-on-scroll">
        <i class="bi bi-bag-x" style="font-size: 5rem; color: var(--gray-400);"></i>
        <h3 class="gradient-text">Aucune commande trouvée</h3>
        <p class="text-muted">Vos commandes apparaîtront ici</p>
        <a th:href="@{/produits}" class="btn btn-primary btn-lg mt-3 btn-glow">
            <i class="bi bi-shop me-2"></i>Voir les produits
        </a>
    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
