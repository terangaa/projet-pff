<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{head :: head('Capteurs')}">
</head>
<body class="particle-bg">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(135deg, var(--primary-800), var(--primary-600)); box-shadow: var(--shadow-lg);">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-seedling-fill fs-4"></i>
            <span>PAGAM</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-house-fill me-1"></i>Accueil
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/capteurs}">
                        <i class="bi bi-wind me-1"></i>Capteurs
                    </a>
                </li>
            </ul>
            <a th:href="@{/auth/logout}" class="btn btn-outline-light">
                <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
            </a>
        </div>
    </div>
</nav>

<div class="page-header gradient-animated">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h1 class="float-animation">
                    <i class="bi bi-wind me-2"></i>Liste des Capteurs
                </h1>
                <p>Surveillez vos capteurs IoT en temps réel</p>
            </div>
            <a th:href="@{/capteurs/ajouter}" class="btn btn-light btn-lg glow-hover btn-glow">
                <i class="bi bi-plus-circle me-2"></i>Ajouter un capteur
            </a>
        </div>
    </div>
</div>

<div class="container mb-5">
    <!-- Messages -->
    <div th:if="${successMessage}" class="alert alert-success animate-fade-in">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger animate-fade-in">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
    </div>

    <!-- Tableau des capteurs -->
    <div th:if="${!#lists.isEmpty(capteurs)}" class="card-modern animate-on-scroll">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-modern mb-0" data-sortable>
                    <thead>
                        <tr>
                            <th data-sort>Nom</th>
                            <th data-sort>Référence</th>
                            <th data-sort>Type</th>
                            <th>Agriculteur</th>
                            <th>Localisation</th>
                            <th data-sort>Moyenne</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="capteur, iterStat : ${capteurs}" class="animate-on-scroll" th:style="'animation-delay: ' + ${iterStat.index * 0.05} + 's;'">
                            <td>
                                <i th:class="${capteur.iconClass} + ' me-2'" style="color: var(--primary-600);"></i>
                                <strong th:text="${capteur.nom}"></strong>
                            </td>
                            <td th:text="${capteur.reference}"></td>
                            <td>
                                <span class="badge bg-info" th:text="${capteur.type}"></span>
                            </td>
                            <td th:text="${capteur.agriculteur.prenom} + ' ' + ${capteur.agriculteur.nom}"></td>
                            <td th:text="${capteur.localisation}"></td>
                            <td>
                                <span class="fw-bold text-primary" th:text="${#numbers.formatDecimal(capteur.moyenne, 1, 1, 'POINT')}"></span>
                            </td>
                            <td>
                                <div class="d-flex gap-2 justify-content-center">
                                    <a th:href="@{/capteurs/detail/{id}(id=${capteur.id})}" class="btn-action view" data-tooltip="Voir les détails">
                                        <i class="bi bi-eye-fill"></i>
                                    </a>
                                    <a th:href="@{/capteurs/modifier/{id}(id=${capteur.id})}" class="btn-action edit" data-tooltip="Modifier">
                                        <i class="bi bi-pencil-fill"></i>
                                    </a>
                                    <a th:href="@{/capteurs/supprimer/{id}(id=${capteur.id})}" 
                                       class="btn-action delete" 
                                       data-tooltip="Supprimer"
                                       onclick="return confirm('Voulez-vous vraiment supprimer ce capteur ?');">
                                        <i class="bi bi-trash-fill"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Message si vide -->
    <div th:if="${#lists.isEmpty(capteurs)}" class="empty-state animate-on-scroll">
        <i class="bi bi-wind" style="font-size: 5rem; color: var(--gray-400);"></i>
        <h3 class="gradient-text">Aucun capteur trouvé</h3>
        <p class="text-muted">Commencez par ajouter votre premier capteur</p>
        <a th:href="@{/capteurs/ajouter}" class="btn btn-primary btn-lg mt-3 btn-glow">
            <i class="bi bi-plus-circle me-2"></i>Ajouter un capteur
        </a>
    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
