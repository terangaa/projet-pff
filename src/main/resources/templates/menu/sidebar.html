<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Layout - Sidebar Pro</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

        <style>
            body { font-family: 'Poppins', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; }
            .content-wrapper { display: flex; flex: 1; min-height: 0; }

            /* Sidebar */
            .sidebar {
                background: #2c3e50;
                color: #fff;
                min-width: 220px;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                padding: 20px;
                transition: all 0.3s;
            }
            .sidebar h4 { font-family: 'Playfair Display', serif; margin-bottom: 30px; }
            .sidebar .nav-link {
                color: #fff;
                padding: 10px 15px;
                border-radius: 8px;
                margin-bottom: 5px;
                display: flex;
                align-items: center;
                gap: 10px;
                transition: all 0.3s;
            }
            .sidebar .nav-link:hover { background: rgba(255,255,255,0.1); color: #1abc9c; text-decoration: none; }
            .sidebar .nav-link.active { background: #1abc9c; color: #fff; }

            /* Main content */
            main { flex-grow: 1; background: #ecf0f1; padding: 30px; overflow-y: auto; }
            main h2 { font-family: 'Playfair Display', serif; font-weight: 700; color: #2c3e50; margin-bottom: 20px; }

            /* Navbar */
            .navbar-custom { background: #34495e; padding: 10px 20px; color: #fff; display: flex; justify-content: flex-end; align-items: center; gap: 15px; }
            .navbar-custom a { color: #fff; text-decoration: none; }
            .navbar-custom a:hover { color: #1abc9c; }

            /* Responsive */
            @media (max-width: 768px) {
                .sidebar { position: fixed; left: -250px; top: 0; height: 100%; z-index: 1000; }
                .sidebar.show { left: 0; }
                main { padding: 20px 10px; }
            }

            .sidebar-toggle { display: none; font-size: 1.5rem; cursor: pointer; margin-right: 15px; }
            @media (max-width: 768px) { .sidebar-toggle { display: block; } }
        </style>
    </head>
    <body>
        <!-- Navbar -->
        <div class="navbar-custom">
            <span class="sidebar-toggle"><i class="bi bi-list"></i></span>
            <span>Connecté : <b th:text="${email}">Utilisateur</b></span>
            <a href="/auth/logout"><i class="bi bi-box-arrow-right"></i> Déconnexion</a>
        </div>

        <div class="content-wrapper">
            <!-- Sidebar -->
            <nav class="sidebar">
                <h4>Menu</h4>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/capteurs}"><i class="bi bi-cpu"></i> Capteurs</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/mesures}"><i class="bi bi-graph-up"></i> Mesures</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/utilisateurs}"><i class="bi bi-people"></i> Utilisateurs</a></li>
                </ul>
            </nav>

            <!-- Main content -->
            <main>
                <div th:insert="${content}"></div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const sidebar = document.querySelector('.sidebar');
            const toggleBtn = document.querySelector('.sidebar-toggle');
            toggleBtn.addEventListener('click', () => sidebar.classList.toggle('show'));
        </script>
    </body>
</html>
