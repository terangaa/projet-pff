<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer mot de passe - PIGAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #28a745;
            --primary-dark: #1e7e34;
            --primary-light: #d4edda;
            --text-dark: #0b3b14;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --gradient-bg: linear-gradient(135deg, #d1f0e2, #f4f9f4);
            --card-bg: linear-gradient(to bottom right, rgba(255,255,255,0.95), rgba(230, 247, 238, 0.9));
        }

        body {
            font-family: "Poppins", sans-serif;
            background: var(--gradient-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .security-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px 30px;
            box-shadow: var(--shadow);
            position: relative;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .profile-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.3);
            object-fit: cover;
            background: #fff;
            margin: 0 auto 15px;
            transition: all 0.3s ease;
        }

        .profile-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(40, 167, 69, 0.4);
        }

        .user-info h3 {
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-dark);
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info p {
            color: #6c757d;
            margin-bottom: 0;
            font-size: 0.9rem;
        }

        .security-card h2 {
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-dark);
            position: relative;
        }

        .security-card h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-dark));
            border-radius: 2px;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: var(--primary-color);
        }

        .form-control {
            border-radius: 15px;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
            transform: translateY(-2px);
        }

        .password-strength {
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak { background: #dc3545; width: 33%; }
        .strength-medium { background: #ffc107; width: 66%; }
        .strength-strong { background: #28a745; width: 100%; }

        .password-requirements {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 5px;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 2px;
        }

        .requirement.valid {
            color: var(--primary-color);
        }

        .requirement.invalid {
            color: #6c757d;
        }

        .btn-primary, .btn-secondary {
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d, #495057);
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .btn-primary:active, .btn-secondary:active {
            transform: translateY(-1px);
        }

        .alert {
            border-radius: 15px;
            font-weight: 500;
            margin-top: 20px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .alert-danger {
            background: linear-gradient(135deg, #f8d7da, #f1aeb5);
            color: #721c24;
        }

        .alert-success {
            background: linear-gradient(135deg, #d1edf1, #a3cfbb);
            color: #0f5132;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .security-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        @media (max-width: 576px) {
            .security-card {
                padding: 30px 20px 20px;
            }
            .profile-avatar {
                width: 80px;
                height: 80px;
            }
            .btn-group {
                flex-direction: column;
            }
            .btn-primary, .btn-secondary {
                width: 100%;
            }
        }

        /* Animation d'entrée */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .security-card {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>

<div class="security-card">
    <!-- Section profil avec vérification sécurisée -->
    <div class="profile-section" th:if="${utilisateur}">
        <img th:src="${utilisateur.photo != null and utilisateur.photo != '' ? utilisateur.photo : '/images/default-avatar.png'}"
             alt="Photo de profil" class="profile-avatar">
        <div class="user-info">
            <h3 th:text="${utilisateur.prenom} + ' ' + ${utilisateur.nom}">Utilisateur</h3>
            <p th:text="${utilisateur.email}">email@exemple.com</p>
        </div>
    </div>

    <!-- Section profil alternative si utilisateur non disponible -->
    <div class="profile-section" th:unless="${utilisateur}">
        <img src="/images/default-avatar.png" alt="Photo de profil" class="profile-avatar">
        <div class="user-info">
            <h3>Utilisateur</h3>
            <p>Profil en cours de chargement...</p>
        </div>
    </div>

    <!-- Icône de sécurité -->
    <div class="security-icon">
        <i class="bi bi-shield-lock"></i>
    </div>

    <h2>Changer le mot de passe</h2>

    <!-- Messages d'erreur ou succès -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Formulaire de changement de mot de passe -->
    <form th:action="@{/parametres/modifier-mot-de-passe}" method="post" id="passwordForm">
        <div class="mb-4">
            <label for="currentPassword" class="form-label">
                <i class="bi bi-key"></i>Mot de passe actuel
            </label>
            <input type="password" class="form-control" id="currentPassword" name="currentPassword" required
                   placeholder="Entrez votre mot de passe actuel">
        </div>

        <div class="mb-4">
            <label for="newPassword" class="form-label">
                <i class="bi bi-key-fill"></i>Nouveau mot de passe
            </label>
            <input type="password" class="form-control" id="newPassword" name="newPassword" required
                   placeholder="Entrez votre nouveau mot de passe" oninput="checkPasswordStrength()">
            <div class="password-strength">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
            <div class="password-requirements">
                <div class="requirement invalid" id="lengthReq">
                    <i class="bi bi-dot"></i>Au moins 8 caractères
                </div>
                <div class="requirement invalid" id="upperReq">
                    <i class="bi bi-dot"></i>Une majuscule
                </div>
                <div class="requirement invalid" id="numberReq">
                    <i class="bi bi-dot"></i>Un chiffre
                </div>
                <div class="requirement invalid" id="specialReq">
                    <i class="bi bi-dot"></i>Un caractère spécial
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label for="confirmPassword" class="form-label">
                <i class="bi bi-check-circle"></i>Confirmer le mot de passe
            </label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                   placeholder="Confirmez votre nouveau mot de passe" oninput="checkPasswordMatch()">
            <div class="password-requirements">
                <div class="requirement invalid" id="matchReq">
                    <i class="bi bi-dot"></i>Les mots de passe correspondent
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary" id="submitBtn">
                <i class="bi bi-shield-check"></i> Mettre à jour la sécurité
            </button>
            <a th:href="@{/parametres/profil}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Retour au profil
            </a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function checkPasswordStrength() {
        const password = document.getElementById('newPassword').value;
        const strengthBar = document.getElementById('strengthBar');
        const requirements = {
            length: document.getElementById('lengthReq'),
            upper: document.getElementById('upperReq'),
            number: document.getElementById('numberReq'),
            special: document.getElementById('specialReq')
        };

        let strength = 0;

        // Vérifier la longueur
        if (password.length >= 8) {
            strength++;
            requirements.length.classList.replace('invalid', 'valid');
            requirements.length.innerHTML = '<i class="bi bi-check-circle-fill"></i>Au moins 8 caractères';
        } else {
            requirements.length.classList.replace('valid', 'invalid');
            requirements.length.innerHTML = '<i class="bi bi-dot"></i>Au moins 8 caractères';
        }

        // Vérifier les majuscules
        if (/[A-Z]/.test(password)) {
            strength++;
            requirements.upper.classList.replace('invalid', 'valid');
            requirements.upper.innerHTML = '<i class="bi bi-check-circle-fill"></i>Une majuscule';
        } else {
            requirements.upper.classList.replace('valid', 'invalid');
            requirements.upper.innerHTML = '<i class="bi bi-dot"></i>Une majuscule';
        }

        // Vérifier les chiffres
        if (/[0-9]/.test(password)) {
            strength++;
            requirements.number.classList.replace('invalid', 'valid');
            requirements.number.innerHTML = '<i class="bi bi-check-circle-fill"></i>Un chiffre';
        } else {
            requirements.number.classList.replace('valid', 'invalid');
            requirements.number.innerHTML = '<i class="bi bi-dot"></i>Un chiffre';
        }

        // Vérifier les caractères spéciaux
        if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
            strength++;
            requirements.special.classList.replace('invalid', 'valid');
            requirements.special.innerHTML = '<i class="bi bi-check-circle-fill"></i>Un caractère spécial';
        } else {
            requirements.special.classList.replace('valid', 'invalid');
            requirements.special.innerHTML = '<i class="bi bi-dot"></i>Un caractère spécial';
        }

        // Mettre à jour la barre de force
        strengthBar.className = 'strength-bar';
        if (strength === 0) {
            strengthBar.style.width = '0%';
        } else if (strength <= 2) {
            strengthBar.classList.add('strength-weak');
        } else if (strength === 3) {
            strengthBar.classList.add('strength-medium');
        } else {
            strengthBar.classList.add('strength-strong');
        }
    }

    function checkPasswordMatch() {
        const password = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const matchReq = document.getElementById('matchReq');

        if (confirmPassword && password === confirmPassword) {
            matchReq.classList.replace('invalid', 'valid');
            matchReq.innerHTML = '<i class="bi bi-check-circle-fill"></i>Les mots de passe correspondent';
        } else {
            matchReq.classList.replace('valid', 'invalid');
            matchReq.innerHTML = '<i class="bi bi-dot"></i>Les mots de passe correspondent';
        }
    }

    // Validation du formulaire
    document.getElementById('passwordForm').addEventListener('submit', function(e) {
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!currentPassword || !newPassword || !confirmPassword) {
            e.preventDefault();
            alert('Veuillez remplir tous les champs');
            return;
        }

        if (newPassword !== confirmPassword) {
            e.preventDefault();
            alert('Les mots de passe ne correspondent pas');
            return;
        }

        if (newPassword.length < 8) {
            e.preventDefault();
            alert('Le mot de passe doit contenir au moins 8 caractères');
            return;
        }

        console.log('Formulaire de changement de mot de passe soumis');
    });

    // Initialisation
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Page de sécurité initialisée');
    });
</script>
</body>
</html>
