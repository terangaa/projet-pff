<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Utilisateur - PAGAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* 🌿 Thème global */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #b4eeb4, #eafbea, #f9fff5);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 🌟 Navbar modernisée */
        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            background: rgba(46, 125, 50, 0.15);
            border-radius: 16px;
            padding: 8px 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .top-bar .btn {
            border-radius: 25px;
            padding: 8px 18px;
            color: #2e7d32;
            background: white;
            border: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .top-bar .btn:hover {
            background: #2e7d32;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46,125,50,0.25);
        }

        /* ✨ Carte profil effet verre */
        .profile-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 90px 30px 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🪞 Avatar stylé */
        .profile-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid #2e7d32;
            object-fit: cover;
            background: #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            margin: -90px auto 15px;
            display: block;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .profile-avatar:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 35px rgba(46,125,50,0.3);
        }

        /* 👋 Texte de bienvenue */
        .welcome-banner {
            font-weight: 600;
            color: #2e7d32;
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .profile-card h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #0b3b14;
            margin-bottom: 5px;
        }

        .role-badge {
            display: inline-block;
            background: linear-gradient(90deg, #2e7d32, #81c784);
            color: #fff;
            padding: 7px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(46,125,50,0.3);
        }

        /* 📋 Informations utilisateur */
        .profile-info {
            margin-top: 25px;
            text-align: left;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(240, 253, 244, 0.9);
            padding: 12px 18px;
            border-radius: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        .info-item:hover {
            background: #e6f7e6;
            transform: translateX(6px);
        }
        .info-item i {
            color: #2e7d32;
            font-size: 1.4rem;
        }
        .info-item span {
            display: inline-block;
            max-width: calc(100% - 40px);
            word-break: break-word;
            font-size: 1rem;
            color: #333;
        }

        /* 🧭 Boutons d’action */
        .profile-actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .profile-actions .btn {
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .profile-actions .btn-primary {
            background: linear-gradient(90deg,#43a047,#2e7d32);
            border: none;
        }
        .profile-actions .btn-primary:hover {
            background: linear-gradient(90deg,#2e7d32,#1b5e20);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(46,125,50,0.3);
        }
        .profile-actions .btn-warning {
            background: linear-gradient(90deg,#ffb300,#ff9800);
            border: none;
        }
        .profile-actions .btn-warning:hover {
            background: linear-gradient(90deg,#f57c00,#ef6c00);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,152,0,0.3);
        }

        /* 🪴 Footer */
        .footer {
            margin-top: 35px;
            text-align: center;
            color: #1b5e20;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* 📱 Responsive */
        @media(max-width:576px){
            .profile-card { padding: 80px 20px 30px; }
            .profile-avatar { width: 100px; height: 100px; margin-top: -70px; }
            .top-bar { max-width: 100%; }
        }
    </style>
</head>

<body>

<div class="container-profile">

    <!-- Navbar -->
    <div class="top-bar">
        <a href="/dashboard" class="btn">
            <i class="bi bi-house-door-fill"></i> Accueil
        </a>
        <a href="/auth/logout" class="btn">
            <i class="bi bi-box-arrow-right"></i> Déconnexion
        </a>
    </div>

    <!-- Carte profil -->
    <div class="profile-card">

        <img src="/images/avatar.png" alt="Avatar" class="profile-avatar">

        <div class="welcome-banner">
            Bonjour <span th:text="${utilisateur.nom}">Sadikh</span> 🌞
        </div>

        <h2 th:text="${utilisateur.nom} + ' 🌻'">Sadikh Yade 🌻</h2>
        <span class="role-badge" th:text="${utilisateur.role}">ADMIN</span>

        <div class="profile-info mt-3">
            <div class="info-item">
                <i class="bi bi-person-circle"></i>
                <span th:text="${utilisateur.nom}">Sadikh Yade</span>
            </div>
            <div class="info-item">
                <i class="bi bi-envelope"></i>
                <span th:text="${utilisateur.email}">sadikhyade@gmail.com</span>
            </div>
            <div class="info-item">
                <i class="bi bi-geo-alt"></i>
                <span th:text="${utilisateur.localite}">Dakar</span>
            </div>
        </div>

        <div class="profile-actions">
            <a href="/parametres/modifier-profil" class="btn btn-primary">
                <i class="bi bi-pencil-square"></i> Modifier Profil
            </a>
            <a href="/parametres/modifier-mot-de-passe" class="btn btn-warning text-white">
                <i class="bi bi-key-fill"></i> Changer Mot de Passe
            </a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer mt-4">
        &copy; 2025 PAGAM. Tous droits réservés 🌱
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
