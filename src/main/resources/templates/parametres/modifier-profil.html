<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Profil - PIGAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg,#d1f0e2,#f4f9f4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .edit-card {
            background: linear-gradient(to bottom right,#ffffffcc,#e6f7ee);
            border-radius: 25px;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            position: relative;
            text-align: center;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #2e7d32;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            object-fit: cover;
            background: #fff;
            margin: 0 auto 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .profile-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .edit-card h2 {
            font-weight: 700;
            margin-bottom: 25px;
            color: #0b3b14;
        }
        .form-label { font-weight: 600; color: #0b3b14; }
        .form-control { border-radius: 12px; padding: 10px 15px; }
        .btn-primary, .btn-secondary {
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .alert {
            border-radius: 12px;
            font-weight: 500;
            margin-top: 15px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .image-upload-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        .image-upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }
        .image-upload-overlay:hover {
            opacity: 1;
        }
        .image-upload-text {
            color: white;
            font-size: 0.8rem;
            text-align: center;
            padding: 0 10px;
        }
        .upload-icon {
            font-size: 1.5rem;
            color: white;
            margin-bottom: 5px;
        }
        @media(max-width:576px){
            .edit-card{padding:30px 20px 20px;}
            .profile-avatar{width:80px;height:80px;}
        }
    </style>
</head>
<body>

<div class="edit-card">
    <!-- Container pour l'upload d'image -->
    <div class="image-upload-container">
        <img th:src="${utilisateur.photo != null and utilisateur.photo != '' ? utilisateur.photo : '/images/default-avatar.png'}"
             alt="Avatar" class="profile-avatar" id="profileAvatar">
        <div class="image-upload-overlay" onclick="document.getElementById('photo').click()">
            <div>
                <i class="bi bi-camera upload-icon"></i>
                <div class="image-upload-text">Changer<br>la photo</div>
            </div>
        </div>
    </div>

    <h2>Modifier votre profil</h2>

    <!-- Messages d'erreur ou succès -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Formulaire avec gestion de l'image -->
    <form th:action="@{/parametres/modifier-profil}" method="post" enctype="multipart/form-data">
        <!-- Champ caché pour l'ID utilisateur -->
        <input type="hidden" name="id" th:value="${utilisateur.id}">

        <!-- Champ fichier pour la photo -->
        <input type="file" id="photo" name="photo" accept="image/*" class="d-none" onchange="previewImage(this)">

        <div class="mb-3 text-start">
            <label for="nom" class="form-label">Nom</label>
            <input type="text" class="form-control" id="nom" name="nom" th:value="${utilisateur.nom}" required>
        </div>

        <div class="mb-3 text-start">
            <label for="prenom" class="form-label">Prénom</label>
            <input type="text" class="form-control" id="prenom" name="prenom" th:value="${utilisateur.prenom}" required>
        </div>

        <div class="mb-3 text-start">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${utilisateur.email}" required>
        </div>

        <div class="mb-3 text-start">
            <label for="localite" class="form-label">Localité</label>
            <input type="text" class="form-control" id="localite" name="localite" th:value="${utilisateur.localite}" placeholder="Ex : Dakar">
        </div>

        <div class="mb-3 text-start">
            <label for="role" class="form-label">Rôle</label>
            <input type="text" class="form-control" id="role" th:value="${utilisateur.role}" disabled>
            <small class="text-muted">Le rôle ne peut pas être modifié</small>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save2"></i> Enregistrer les modifications
            </button>
            <a th:href="@{/parametres/profil}" class="btn btn-secondary">
                <i class="bi bi-x-circle"></i> Annuler
            </a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Fonction pour prévisualiser l'image sélectionnée
    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();

            reader.onload = function(e) {
                document.getElementById('profileAvatar').src = e.target.result;

                // Afficher un message de confirmation
                const fileName = input.files[0].name;
                console.log('Image sélectionnée:', fileName);

                // Optionnel: Afficher un toast ou message
                showMessage(`Image "${fileName}" sélectionnée`, 'success');
            };

            reader.readAsDataURL(input.files[0]);
        }
    }

    // Fonction pour afficher des messages temporaires
    function showMessage(message, type) {
        // Créer un élément de message temporaire
        const messageDiv = document.createElement('div');
        messageDiv.className = `alert alert-${type} alert-dismissible fade show`;
        messageDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;

        // Ajouter au début de la carte
        const card = document.querySelector('.edit-card');
        card.insertBefore(messageDiv, card.firstChild);

        // Supprimer automatiquement après 3 secondes
        setTimeout(() => {
            if (messageDiv.parentNode) {
                messageDiv.remove();
            }
        }, 3000);
    }

    // Permettre aussi le clic direct sur l'image
    document.getElementById('profileAvatar').addEventListener('click', function() {
        document.getElementById('photo').click();
    });

    // Validation du formulaire
    document.querySelector('form').addEventListener('submit', function(e) {
        const nom = document.getElementById('nom').value.trim();
        const prenom = document.getElementById('prenom').value.trim();
        const email = document.getElementById('email').value.trim();

        if (!nom || !prenom || !email) {
            e.preventDefault();
            showMessage('Veuillez remplir tous les champs obligatoires', 'danger');
            return;
        }

        // Validation email basique
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            e.preventDefault();
            showMessage('Veuillez entrer une adresse email valide', 'danger');
            return;
        }

        console.log('Formulaire validé, envoi en cours...');
    });

    // Initialisation
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Page de modification de profil initialisée');
    });
</script>
</body>
</html>
