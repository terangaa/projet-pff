<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Profil - PAGAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg,#d1f0e2,#f4f9f4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .edit-card {
            background: linear-gradient(to bottom right,#ffffffcc,#e6f7ee);
            border-radius: 25px;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            position: relative;
            text-align: center;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #2e7d32;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            object-fit: cover;
            background: #fff;
            margin: 0 auto 20px;
        }
        .edit-card h2 {
            font-weight: 700;
            margin-bottom: 25px;
            color: #0b3b14;
        }
        .form-label { font-weight: 600; color: #0b3b14; }
        .form-control { border-radius: 12px; padding: 10px 15px; }
        .btn-primary, .btn-secondary {
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .alert {
            border-radius: 12px;
            font-weight: 500;
            margin-top: 15px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        @media(max-width:576px){
            .edit-card{padding:30px 20px 20px;}
            .profile-avatar{width:80px;height:80px;}
        }
    </style>
</head>
<body>

<div class="edit-card">
    <img src="/images/avatar.png" alt="Avatar" class="profile-avatar">
    <h2>Modifier votre profil</h2>

    <!-- Messages d'erreur ou succès -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/parametres/modifier-profil}" method="post">
        <div class="mb-3 text-start">
            <label for="nom" class="form-label">Nom complet</label>
            <input type="text" class="form-control" id="nom" name="nom" th:value="${utilisateur.nom}" required>
        </div>

        <div class="mb-3 text-start">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${utilisateur.email}" required>
        </div>

        <div class="mb-3 text-start">
            <label for="localite" class="form-label">Localité</label>
            <input type="text" class="form-control" id="localite" name="localite" th:value="${utilisateur.localite}" placeholder="Ex : Dakar" required>
        </div>

        <div class="mb-3 text-start">
            <label for="role" class="form-label">Rôle</label>
            <input type="text" class="form-control" id="role" th:value="${utilisateur.role}" disabled>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save2"></i> Enregistrer</button>
            <a href="/parametres/profil" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Annuler</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
