<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une Vente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- 🔹 Barre de navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-light" th:href="@{/dashboard}">🌾 Gestion Agricole</a>
        <div class="d-flex ms-auto">
            <a class="btn btn-outline-light me-2" th:href="@{/dashboard}">🏠 Accueil</a>
            <a href="/auth/logout" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="bi bi-box-arrow-right"></i> Déconnexion
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Ajouter une Vente</h2>

    <form th:action="@{/ventes/ajouter}" th:object="${vente}" method="post" class="needs-validation" novalidate>
        <div class="mb-3">
            <label for="produit" class="form-label">Produit</label>
            <select id="produit" name="produit.id" th:field="*{produit.id}" class="form-select" required>
                <option value="" disabled selected>-- Choisir un produit --</option>
                <option th:each="p : ${produits}" th:value="${p.id}" th:text="${p.nom}"
                        th:data-prix="${p.prix}"></option>
            </select>
            <div class="invalid-feedback">Veuillez sélectionner un produit.</div>
        </div>

        <div class="mb-3">
            <label for="acheteur" class="form-label">Acheteur</label>
            <select id="acheteur" name="acheteur.id" th:field="*{acheteur.id}" class="form-select" required>
                <option value="" disabled selected>-- Choisir un acheteur --</option>
                <option th:each="u : ${utilisateurs}" th:value="${u.id}" th:text="${u.nom}"></option>
            </select>
            <div class="invalid-feedback">Veuillez sélectionner un acheteur.</div>
        </div>

        <div class="mb-3">
            <label for="quantite" class="form-label">Quantité</label>
            <input type="number" id="quantite" th:field="*{quantite}" class="form-control" min="1" value="1" required>
            <div class="invalid-feedback">Veuillez entrer une quantité valide.</div>
        </div>

        <div class="mb-3">
            <label for="prix" class="form-label">Prix unitaire</label>
            <input type="number" step="0.01" id="prix" th:field="*{prix}" class="form-control" min="0" readonly>
        </div>

        <div class="mb-3">
            <label for="montantTotal" class="form-label">Montant Total</label>
            <input type="number" step="0.01" id="montantTotal" class="form-control" readonly>
        </div>

        <button type="submit" class="btn btn-primary">Ajouter</button>
        <a th:href="@{/ventes}" class="btn btn-secondary">Annuler</a>
    </form>
</div>

<script>
    (function () {
        'use strict';

        // 🔹 Validation Bootstrap
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });

        // 🔹 Calcul dynamique du prix et montant total
        const produitSelect = document.getElementById('produit');
        const quantiteInput = document.getElementById('quantite');
        const prixInput = document.getElementById('prix');
        const montantTotalInput = document.getElementById('montantTotal');

        function updatePrixMontant() {
            const selectedOption = produitSelect.selectedOptions[0];
            const prix = parseFloat(selectedOption?.dataset.prix || 0);
            const quantite = parseInt(quantiteInput.value) || 0;

            prixInput.value = prix.toFixed(2);
            montantTotalInput.value = (prix * quantite).toFixed(2);
        }

        produitSelect.addEventListener('change', updatePrixMontant);
        quantiteInput.addEventListener('input', updatePrixMontant);

        // 🔹 Initialisation au chargement si un produit est déjà sélectionné
        window.addEventListener('DOMContentLoaded', updatePrixMontant);
    })();
</script>

</body>
</html>
