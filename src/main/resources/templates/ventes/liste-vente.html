<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des ventes - 🌾 Gestion Agricole</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }

        /* Containers */
        .cards-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .sale-card {
            background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden; transition: transform 0.3s, box-shadow 0.3s, opacity 0.5s, transform 0.5s;
            width: 100%; max-width: 320px; opacity: 1; transform: translateY(0);
        }
        .sale-card.hidden { opacity: 0; transform: translateY(20px); pointer-events: none; }
        .sale-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .sale-card img { width: 100%; height: 180px; object-fit: cover; }

        .card-body { padding: 15px; }
        .badge-status { font-size: 0.85rem; padding: 0.35em 0.6em; border-radius: 12px; }

        /* Desktop Table */
        .table-container { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .filter-container { margin-bottom: 15px; gap: 10px; flex-wrap: wrap; display: flex; }

        @media (max-width: 768px) { .table-responsive { display: none; } }
        @media (min-width: 769px) { #cardsContainer { display: none; } }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">🌾 Gestion Agricole</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="btn btn-outline-light me-2" th:href="@{/dashboard}">🏠 Accueil</a></li>
                <li class="nav-item"><a class="btn btn-outline-light btn-sm rounded-pill" href="/auth/logout"><i class="bi bi-box-arrow-right"></i> Déconnexion</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <h2 class="mb-3 mb-md-0">Liste des ventes</h2>
        <a th:href="@{/ventes/ajouter}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Ajouter une vente</a>
    </div>

    <div class="table-container">
        <!-- Filters -->
        <input type="text" id="searchInput" class="form-control mb-2" placeholder="Rechercher client ou produit..." onkeyup="filterCards()">
        <select id="statusFilter" class="form-select mb-3" onchange="filterCards()">
            <option value="">Tous les statuts</option>
            <option value="VALIDEE">Validée</option>
            <option value="EN_COURS">En cours</option>
            <option value="ANNULEE">Annulée</option>
        </select>

        <!-- Desktop Table -->
        <div th:if="${!ventes.isEmpty()}" class="table-responsive">
            <table id="venteTable" class="table table-hover align-middle text-center">
                <thead class="table-success">
                <tr>
                    <th>ID</th><th>Produit</th><th>Client</th><th>Prix</th><th>Quantité</th>
                    <th>Montant</th><th>Date</th><th>Statut</th><th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vente : ${ventes}">
                    <td th:text="${vente.id}"></td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <img th:src="${vente.produit != null && vente.produit.image != null ? vente.produit.image : '/images/produit-placeholder.png'}" style="width:50px;height:50px;object-fit:cover;border-radius:6px;">
                            <span th:text="${vente.produit != null ? vente.produit.nom : 'Inconnu'}"></span>
                        </div>
                    </td>
                    <td th:text="${vente.acheteur != null ? vente.acheteur.nom : 'Inconnu'}"></td>
                    <td th:text="${#numbers.formatDecimal(vente.prix,1,2)} + ' F CFA'"></td>
                    <td th:text="${vente.quantite}"></td>
                    <td th:text="${#numbers.formatDecimal(vente.montantTotal,1,2)} + ' F CFA'"></td>
                    <td th:text="${vente.dateVente != null ? #temporals.format(vente.dateVente,'dd/MM/yyyy HH:mm') : '-'}"></td>
                    <td>
                            <span th:switch="${vente.commande != null ? vente.commande.statut : 'Aucune'}">
                                <span th:case="'VALIDEE'" class="badge bg-success badge-status">Validée</span>
                                <span th:case="'EN_COURS'" class="badge bg-warning text-dark badge-status">En cours</span>
                                <span th:case="'ANNULEE'" class="badge bg-danger badge-status">Annulée</span>
                                <span th:case="*">Aucune</span>
                            </span>
                    </td>
                    <td class="d-flex justify-content-center gap-1 flex-wrap">
                        <a th:href="@{/ventes/modifier/{id}(id=${vente.id})}" class="btn btn-sm btn-primary"><i class="bi bi-pencil"></i> Modifier</a>
                        <a th:href="@{/ventes/supprimer/{id}(id=${vente.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Voulez-vous vraiment supprimer cette vente ?');"><i class="bi bi-trash"></i> Supprimer</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Mobile Cards -->
        <div id="cardsContainer" class="cards-container mt-3">
            <div th:each="vente : ${ventes}" class="sale-card card">
                <img th:src="${vente.produit != null && vente.produit.image != null ? vente.produit.image : '/images/produit-placeholder.png'}" alt="Produit">
                <div class="card-body">
                    <h5 class="card-title" th:text="${vente.produit != null ? vente.produit.nom : 'Inconnu'}"></h5>
                    <p><strong>Client:</strong> <span th:text="${vente.acheteur != null ? vente.acheteur.nom : 'Inconnu'}"></span></p>
                    <p><strong>Prix:</strong> <span th:text="${#numbers.formatDecimal(vente.prix,1,2)} + ' F CFA'"></span></p>
                    <p><strong>Quantité:</strong> <span th:text="${vente.quantite}"></span></p>
                    <p><strong>Montant:</strong> <span th:text="${#numbers.formatDecimal(vente.montantTotal,1,2)} + ' F CFA'"></span></p>
                    <p><strong>Date:</strong> <span th:text="${vente.dateVente != null ? #temporals.format(vente.dateVente,'dd/MM/yyyy HH:mm'):'-'}"></span></p>
                    <p><strong>Statut:</strong>
                        <span th:switch="${vente.commande != null ? vente.commande.statut : 'Aucune'}">
                            <span th:case="'VALIDEE'" class="badge bg-success badge-status">Validée</span>
                            <span th:case="'EN_COURS'" class="badge bg-warning text-dark badge-status">En cours</span>
                            <span th:case="'ANNULEE'" class="badge bg-danger badge-status">Annulée</span>
                            <span th:case="*">Aucune</span>
                        </span>
                    </p>
                    <div class="d-flex justify-content-between mt-2">
                        <a th:href="@{/ventes/modifier/{id}(id=${vente.id})}" class="btn btn-sm btn-primary"><i class="bi bi-pencil"></i> Modifier</a>
                        <a th:href="@{/ventes/supprimer/{id}(id=${vente.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Voulez-vous vraiment supprimer cette vente ?');"><i class="bi bi-trash"></i> Supprimer</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav class="mt-3 d-flex justify-content-center">
            <ul class="pagination" id="pagination"></ul>
        </nav>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentPage = 1;
    const cardsPerPage = 5;

    function showPage() {
        const cards = Array.from(document.querySelectorAll("#cardsContainer .sale-card"));
        const totalPages = Math.ceil(cards.length / cardsPerPage);

        cards.forEach((card,index)=>{
            if(index >= (currentPage-1)*cardsPerPage && index < currentPage*cardsPerPage){
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        const pagination = document.getElementById("pagination");
        pagination.innerHTML = "";

        const prevLi = document.createElement("li");
        prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
        prevLi.innerHTML = `<a class="page-link" href="#">Précédent</a>`;
        prevLi.onclick = (e)=>{ e.preventDefault(); if(currentPage>1){currentPage--; showPage();} };
        pagination.appendChild(prevLi);

        for(let i=1;i<=totalPages;i++){
            const li = document.createElement("li");
            li.className = `page-item ${i===currentPage ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
            li.onclick = (e)=>{ e.preventDefault(); currentPage=i; showPage(); };
            pagination.appendChild(li);
        }

        const nextLi = document.createElement("li");
        nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
        nextLi.innerHTML = `<a class="page-link" href="#">Suivant</a>`;
        nextLi.onclick = (e)=>{ e.preventDefault(); if(currentPage<totalPages){currentPage++; showPage();} };
        pagination.appendChild(nextLi);
    }

    // Filtering
    function filterCards() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const statusFilter = document.getElementById("statusFilter").value.toLowerCase();
        const cards = document.querySelectorAll("#cardsContainer .sale-card");

        cards.forEach(card=>{
            const produit = card.querySelector(".card-title").textContent.toLowerCase();
            const client = card.querySelector("p strong:nth-child(1)").nextSibling.textContent.toLowerCase();
            const statut = card.querySelector(".badge-status")?.textContent.toLowerCase() || "";
            if((produit.includes(input) || client.includes(input)) && (!statusFilter || statut.includes(statusFilter))){
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
        currentPage = 1; showPage();
    }

    window.onload = () => { filterCards(); };
</script>

</body>
</html>
