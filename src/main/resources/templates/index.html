<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{head :: head('Dashboard Général')}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, var(--primary-800), var(--primary-600)); box-shadow: var(--shadow-md);">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard PAGAM</span>
        </a>
        <button class="btn btn-outline-light ms-auto" id="logoutBtn">
            <i class="bi bi-box-arrow-right me-2"></i>Se déconnecter
        </button>
    </div>
</nav>

<div class="container my-5">
    <div class="text-center mb-5 animate-fade-in">
        <h1 id="welcomeMsg" class="mb-3">Bienvenue</h1>
        <p id="roleMsg" class="text-muted fs-5">Vous êtes connecté(e).</p>
    </div>

    <!-- Sections -->
    <div id="adminSection" class="d-none animate-slide-in">
        <div class="card mb-4 shadow-lg">
            <div class="card-header" style="background: linear-gradient(135deg, var(--primary-600), var(--primary-500)); color: white;">
                <h5 class="mb-0"><i class="bi bi-people-fill me-2"></i>Liste des Utilisateurs</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0" id="usersTable" data-sortable>
                        <thead class="table-light">
                        <tr>
                            <th data-sort>ID</th>
                            <th data-sort>Nom</th>
                            <th data-sort>Email</th>
                            <th>Rôle</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="agriculteurSection" class="d-none animate-slide-in">
        <div class="card mb-4 shadow-lg">
            <div class="card-header" style="background: linear-gradient(135deg, var(--success), var(--success-light)); color: white;">
                <h5 class="mb-0"><i class="bi bi-seedling-fill me-2"></i>Liste des Produits</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0" id="produitsTable" data-sortable>
                        <thead class="table-light">
                        <tr>
                            <th data-sort>ID</th>
                            <th data-sort>Nom</th>
                            <th data-sort>Prix (FCFA)</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="acheteurSection" class="d-none animate-slide-in">
        <div class="card mb-4 shadow-lg">
            <div class="card-header" style="background: linear-gradient(135deg, var(--info), var(--info-light)); color: white;">
                <h5 class="mb-0"><i class="bi bi-cart-check-fill me-2"></i>Liste des Commandes</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0" id="commandesTable" data-sortable>
                        <thead class="table-light">
                        <tr>
                            <th data-sort>ID</th>
                            <th data-sort>Produit</th>
                            <th data-sort>Quantité</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="decideurSection" class="d-none animate-slide-in">
        <div class="card mb-4 shadow-lg">
            <div class="card-header" style="background: linear-gradient(135deg, var(--warning), var(--warning-light)); color: var(--gray-900);">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>Liste des Alertes</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0" id="alertesTable" data-sortable>
                        <thead class="table-light">
                        <tr>
                            <th data-sort>ID</th>
                            <th data-sort>Message</th>
                            <th data-sort>Date</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8086/api";
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    if (!token || !role) {
        alert("Veuillez vous connecter !");
        window.location.href = "login.html";
    }

    const welcomeMsg = document.getElementById("welcomeMsg");
    const roleMsg = document.getElementById("roleMsg");

    function badgeClass(r) {
        switch(r) {
            case "ADMIN": return "badge bg-danger badge-role";
            case "AGRICULTEUR": return "badge bg-success badge-role";
            case "ACHETEUR": return "badge bg-primary badge-role";
            case "DECIDEUR": return "badge bg-warning text-dark badge-role";
            default: return "badge bg-secondary badge-role";
        }
    }

    switch(role) {
        case "ADMIN":
            welcomeMsg.textContent = "Bienvenue ADMIN 🚀";
            roleMsg.textContent = "Gérez les utilisateurs et ressources.";
            document.getElementById("adminSection").classList.remove("d-none");
            loadUsers();
            break;
        case "AGRICULTEUR":
            welcomeMsg.textContent = "Bienvenue AGRICULTEUR 🌱";
            roleMsg.textContent = "Gérez vos produits et alertes agricoles.";
            document.getElementById("agriculteurSection").classList.remove("d-none");
            loadProduits();
            break;
        case "ACHETEUR":
            welcomeMsg.textContent = "Bienvenue ACHETEUR 🛒";
            roleMsg.textContent = "Consultez les produits et vos commandes.";
            document.getElementById("acheteurSection").classList.remove("d-none");
            loadCommandes();
            break;
        case "DECIDEUR":
            welcomeMsg.textContent = "Bienvenue DECIDEUR 📊";
            roleMsg.textContent = "Analysez les alertes et rapports agricoles.";
            document.getElementById("decideurSection").classList.remove("d-none");
            loadAlertes();
            break;
        default:
            alert("Rôle inconnu !");
            localStorage.clear();
            window.location.href = "login.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.clear();
        window.location.href = "login.html";
    });

    async function fetchWithJWT(url) {
        const res = await fetch(url, { headers: { "Authorization": "Bearer " + token } });
        if (!res.ok) throw new Error("Erreur HTTP " + res.status);
        return res.json();
    }

    async function loadUsers() {
        try {
            const users = await fetchWithJWT(`${API_BASE}/utilisateurs`);
            const tbody = document.querySelector("#usersTable tbody");
            tbody.innerHTML = "";
            users.forEach(u => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${u.id}</td><td>${u.nom}</td><td>${u.email}</td><td><span class="${badgeClass(u.role)}">${u.role}</span></td>`;
                tbody.appendChild(tr);
            });
        } catch(err){ console.error(err); }
    }

    async function loadProduits() {
        try {
            const produits = await fetchWithJWT(`${API_BASE}/produits`);
            const tbody = document.querySelector("#produitsTable tbody");
            tbody.innerHTML = "";
            produits.forEach(p => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${p.id}</td><td>${p.nom}</td><td>${p.prix}</td>`;
                tbody.appendChild(tr);
            });
        } catch(err){ console.error(err); }
    }

    async function loadCommandes() {
        try {
            const commandes = await fetchWithJWT(`${API_BASE}/commandes`);
            const tbody = document.querySelector("#commandesTable tbody");
            tbody.innerHTML = "";
            commandes.forEach(c => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${c.id}</td><td>${c.produit.nom}</td><td>${c.quantite}</td>`;
                tbody.appendChild(tr);
            });
        } catch(err){ console.error(err); }
    }

    async function loadAlertes() {
        try {
            const alertes = await fetchWithJWT(`${API_BASE}/alertes`);
            const tbody = document.querySelector("#alertesTable tbody");
            tbody.innerHTML = "";
            alertes.forEach(a => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${a.id}</td><td>${a.message}</td><td>${new Date(a.date).toLocaleString()}</td>`;
                tbody.appendChild(tr);
            });
        } catch(err){ 
            console.error(err);
            if (window.PAGAM) {
                window.PAGAM.showToast('Erreur lors du chargement des données', 'error');
            }
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
